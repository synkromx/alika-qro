    <button class="btn ghost" data-a="lote" data-m="TRASPASO_SEDE">🔀 Traspaso a otra sede</button>
    <button class="btn ghost" data-a="importar">📥 Cargar inventario de una sede</button>
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:10px"><input type="search" placeholder="🔍 Buscar producto, clave o color…" value="${esc(UI.iq)}" data-i="iq" style="flex:1;width:auto;min-width:220px">
      <label class="chk"><input type="checkbox" data-c="iSolo" ${UI.iSolo ? 'checked' : ''}> Solo con existencia</label></div>
    ${catChips(UI.icat, 'icat')}
    <div class="tw" style="margin-top:10px"><table class="t"><thead><tr><th>Clave</th><th>Producto</th><th>Color</th>${esTodas() ? sedesCodigos().map(c => `<th class="n">${sedeTag(c)}</th>`).join('') : '<th class="n">Stand</th><th class="n">Casa</th>'}<th class="n">Existencia${esTodas() ? ' total' : ''}</th><th class="n">Precio venta</th><th class="n">Valor fab.</th></tr></thead><tbody id="itb"></tbody></table></div>
  </div>
  ${(S.config.lista_casa || []).length ? `<div class="card"><h3>🏠 Lista "Tenemos en casa" (de la hoja de Alika)</h3><ul>${S.config.lista_casa.map(x => `<li>${esc(x)}</li>`).join('')}</ul><div class="small muted">Es una lista de referencia. Para que cuenten como "en casa" en el inventario, usa <b>Stand ⇄ Casa</b>.</div></div>` : ''}`;
};
SCREENS.inventario_after = () => renderInvTabla();
function renderInvTabla(){
  const Q = norm(UI.iq);
  const vs = S.variantes.map(v => ({v, p:IDX.prod.get(v.producto_id), s:stockOf(v.id)})).filter(x => x.p && (UI.icat === 'Todas' || x.p.categoria === UI.icat) && (!UI.iSolo || x.s.total > 0) && (!Q || Q.split(' ').every(w => norm(x.p.nombre + ' ' + x.p.clave + ' ' + x.v.color).includes(w))))
    .sort((a,b) => a.p.categoria.localeCompare(b.p.categoria) || a.p.nombre.localeCompare(b.p.nombre) || a.v.color.localeCompare(b.v.color));
  const umb = num(S.config.umbral_existencia_baja); const T = esTodas(); const sc = sedesCodigos();
  $('#itb').innerHTML = vs.map(({v,p,s}) => `<tr class="click" data-a="kardex" data-v="${v.id}"><td class="small">${esc(p.clave)}${p.revisar ? ' <span class="pill warn">revisar</span>' : ''}</td><td>${esc(p.nombre)}</td><td>${esc(v.color)}</td>
    ${T ? sc.map(c => `<td class="n">${int(stockOf(v.id, c).total)}</td>`).join('') : `<td class="n">${int(s.Stand)}</td><td class="n">${s.Casa ? int(s.Casa) : ''}</td>`}<td class="n"><span class="pill ${s.total <= 0 ? 'bad' : s.total <= umb ? 'warn' : 'ok'}">${int(s.total)}</span></td><td class="n">${money(precioVenta(p))}</td><td class="n">${money(s.total * num(p.precio_fabricante))}</td></tr>`).join('') +
    `<tr class="tot"><td colspan="3">${vs.length} variantes</td>${T ? sc.map(c => `<td class="n">${int(sum(vs, x => stockOf(x.v.id, c).total))}</td>`).join('') : '<td></td><td></td>'}<td class="n">${int(sum(vs, x => x.s.total))}</td><td></td><td class="n">${money(sum(vs, x => x.s.total * num(x.p.precio_fabricante)))}</td></tr>`;
}
I.iq = debounce(el => { UI.iq = el.value; renderInvTabla(); }, 150);
C.iSolo = el => { UI.iSolo = el.checked; renderInvTabla(); };
A.icat = el => { UI.icat = el.dataset.v; $$('[data-a="icat"]').forEach(b => b.classList.toggle('on', b.dataset.v === UI.icat)); renderInvTabla(); };

/* kárdex de una variante */
A.kardex = el => kardexModal(el.dataset.v);
function kardexRows(vid, sede = vista()){
  let saldo = 0;
  return S.movimientos.filter(m => m.variante_id === vid && enSede(m, sede)).map(m => { saldo += delta(m); return {m, d:delta(m), saldo}; });
}
function detalleMov(m){
  return [IDX.ev.get(m.evento_id)?.nombre, esVentaMov(m) ? money(m.precio_venta_unit) + (num(m.descuento) ? ' −' + money(m.descuento) : '') : '', m.metodo_pago, m.persona, m.motivo,
    m.tipo === 'TRASPASO' ? `${m.ubicacion} → ${m.ubicacion_destino}` : '', m.tipo === 'TRASPASO_SEDE' ? (num(m.cantidad) < 0 ? `hacia ${sedeNombre(m.sede_destino)}` : `desde ${sedeNombre(m.sede_origen)}`) : '', m.nota].filter(Boolean).join(' · ');
}
function kardexModal(vid){
  const v = IDX.vari.get(vid), p = IDX.prod.get(v.producto_id), s = stockOf(vid);
  const rows = kardexRows(vid);
  modal(`${mhead('Kárdex')}<div class="row between"><div><div class="b" style="font-size:1.15rem">${esc(p.nombre)} · ${esc(v.color)}</div>
      <div class="muted small">${esc(p.clave)} · ${esc(p.categoria)} · Fab. ${money(p.precio_fabricante)} · Venta ${money(precioVenta(p))} · ${esTodas() ? 'todas las sedes' : 'sede ' + esc(sedeNombre(vista()))}</div></div>
      <div class="kpi" style="padding:8px 14px"><div class="l">Existencia</div><div class="v">${int(s.total)}</div><div class="s">${esTodas() ? sedesCodigos().map(c => `${c} ${int(stockOf(vid, c).total)}`).join(' · ') : `Stand ${int(s.Stand)} · Casa ${int(s.Casa)}`}</div></div></div>
    <div class="tw" style="margin:12px 0;max-height:50vh"><table class="t"><thead><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th class="n">Mov.</th><th class="n">Saldo</th><th></th></tr></thead><tbody>
    ${rows.map(({m, d, saldo}) => `<tr><td class="small">${fdt(m.fecha_hora)}</td><td>${esTodas() ? sedeTag(m.sede_codigo) + ' ' : ''}${TIPO_MOV_TXT[m.tipo] || m.tipo}</td>
      <td class="small">${esc(detalleMov(m))}</td>
      <td class="n ${d < 0 ? 'neg' : d > 0 ? 'pos' : ''}">${m.tipo === 'TRASPASO' ? '⇄ ' + int(m.cantidad) : (d > 0 ? '+' : '') + int(d)}</td><td class="n b">${int(saldo)}</td>
      <td>${m.corte_id ? `<span class="pill ${corteDe(m)?.estado === 'Pagado' ? 'ok' : 'gray'}">${corteDe(m)?.estado === 'Pagado' ? 'liquidada' : 'en corte'}</span>` : `<button class="btn sm ghost" style="min-height:38px" data-a="borrarMov" data-id="${m.id}" title="Borrar">🗑️</button>`}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Sin movimientos</td></tr>'}
    </tbody></table></div>
    <div class="row"><button class="btn pri" data-a="ajusteUno" data-v="${vid}">± Ajustar existencia</button><button class="btn ghost" data-a="repKardex" data-v="${vid}">🖨️ Imprimir kárdex</button></div>`, {wide:true});
}
A.borrarMov = async el => {
  if (!requiereSede()) return;
  const m = S.movimientos.find(x => x.id === el.dataset.id); if (!m) return;
  const grupo = m.separacion_id ? S.movimientos.filter(x => x.separacion_id === m.separacion_id)
    : m.tipo === 'TRASPASO_SEDE' && m.traspaso_id ? S.movimientos.filter(x => x.traspaso_id === m.traspaso_id)
    : (m.venta_grupo && m.tipo === 'CAMBIO') ? S.movimientos.filter(x => x.venta_grupo === m.venta_grupo && x.tipo === 'CAMBIO') : [m];
  if (grupo.some(x => x.corte_id)){ alertDlg('No se puede borrar', 'Este movimiento ya está en un corte con Alika (venta liquidada o por liquidar). Solo se puede revertir con un movimiento contrario (ajuste).'); return; }
  if (!await confirmDlg({titulo:'¿Borrar movimiento?', msg:`${TIPO_MOV_TXT[m.tipo]} del ${fdt(m.fecha_hora)} (${int(Math.abs(m.cantidad))} pza). ${grupo.length > 1 ? (m.separacion_id ? `Es parte de la separación de un juego: se deshace completa (${grupo.length} movimientos, incluye las ventas de las partes) y el juego regresa entero. ` : m.tipo === 'TRASPASO_SEDE' ? 'También se borra la entrada/salida en la otra sede. ' : 'También se borrará la otra mitad del cambio. ') : ''}La existencia se recalcula.`, ok:'Sí, borrar', danger:true})) return;
  await del('movimientos', grupo.map(x => x.id)); closeModal(); toast('Movimiento borrado'); kardexModal(m.variante_id); if (UI.screen !== 'vender') rerender();
};
A.ajusteUno = el => {
  if (!requiereSede()) return;
  const vid = el.dataset.v; let signo = -1;
  const m = modal(`${mhead('± Ajuste de existencia')}<div class="stack"><div class="b">${esc(varLabel(vid))}</div><div class="muted">Existencia actual: ${int(stockOf(vid).total)}</div>
    <div class="seg"><button data-s="1">➕ Sumar</button><button class="on" data-s="-1">➖ Restar</button></div>
    <label class="f">Cantidad<input type="number" inputmode="numeric" min="1" id="aq" value="1"></label>
    <label class="f">Motivo (obligatorio)<select id="am">${['Rotura','Pérdida','Conteo físico','Error de captura','Otro'].map(x => opt(x, x, '')).join('')}</select></label>
    <label class="f">Nota<input type="text" id="an"></label>
    <div class="row" style="justify-content:flex-end"><button class="btn pri" id="aok">Guardar ajuste</button></div></div>`);
  $$('[data-s]', m).forEach(b => b.onclick = () => { signo = +b.dataset.s; $$('[data-s]', m).forEach(x => x.classList.toggle('on', x === b)); });
  $('#aok', m).onclick = async () => {
    const q = Math.abs(Math.round(num(val('#aq', m)))); const motivo = val('#am', m);
    if (!q){ toast('Escribe la cantidad.'); return; } if (!motivo){ toast('El ajuste necesita motivo.'); return; }
    if (signo < 0 && q > stockOf(vid).total){ toast(`No hay suficientes piezas: quedan ${int(stockOf(vid).total)}`); return; }
    const p = prodOfVar(vid);
    await put('movimientos', {id:uuid(), fecha_hora:nowISO(), tipo:'AJUSTE', variante_id:vid, producto_id:p.id, cantidad:signo * q, ubicacion:'Stand', precio_venta_unit:precioVenta(p), precio_fabricante_unit:num(p.precio_fabricante), motivo, nota:val('#an', m)});
    closeModal(); closeModal(); toast('✅ Ajuste guardado'); kardexModal(vid); if (UI.screen === 'inventario') renderInvTabla();
  };
};

/* captura por lote: ENTRADA, DEVOLUCION, CONTEO (ajustes), TRASPASO */
A.lote = el => { if (requiereSede()) loteModal(el.dataset.m); };
function loteModal(mode){
  if (esTodas()) throw new Error('Elige una sede para registrar.');
  const otras = sedes().filter(x => x.codigo !== vista());
  if (mode === 'TRASPASO_SEDE' && !otras.length){ alertDlg('No hay otra sede', 'Agrega otra sede en Configuración.'); return; }
  const L = {q:new Map(), search:'', cat:'Todas', fecha:localDT(), nota:'', ubicacion:'Stand', destino:'Casa', motivo:'Conteo físico'};
  const TIT = {ENTRADA:`📥 Recibir mercancía de Alika en ${esc(sedeNombre(vista()))}`, DEVOLUCION:`↩️ Devolver mercancía a Alika desde ${esc(sedeNombre(vista()))}`, CONTEO:`📋 Conteo físico / ajuste en ${esc(sedeNombre(vista()))}`, TRASPASO:'🚚 Pasar piezas entre Stand y Casa',
    TRASPASO_SEDE:`🔀 Traspaso de ${esc(sedeNombre(vista()))} a otra sede`};
  const AYUDA = {ENTRADA:'Escribe cuántas piezas llegaron de cada variante. Solo se guardan las que tengan cantidad.',
    DEVOLUCION:'Escribe cuántas piezas se le regresan a Alika.',
    CONTEO:'Escribe lo que contaste físicamente. La app crea un ajuste por la diferencia contra el sistema.',
    TRASPASO:'Escribe cuántas piezas se mueven. La existencia total no cambia.',
    TRASPASO_SEDE:'Las piezas salen de esta sede y entran en la sede destino en un solo paso. El total consolidado no cambia.'};
  const m = modal(`${mhead(TIT[mode])}<div class="alert info">${AYUDA[mode]}</div>
    <div class="row">
      <label class="f" style="flex:1;min-width:200px">Fecha y hora<input type="datetime-local" id="lf" value="${L.fecha}"></label>
      ${mode === 'ENTRADA' ? `<label class="f">Se guarda en<select id="lu">${UBICACIONES.map(u => opt(u, u, 'Stand')).join('')}</select></label>` : ''}
      ${mode === 'TRASPASO' ? `<label class="f">Dirección<select id="lu">${opt('Stand','Del Stand → a Casa','Stand')}${opt('Casa','De Casa → al Stand','')}</select></label>` : ''}
      ${mode === 'TRASPASO_SEDE' ? `<label class="f">Salen de<select id="lu">${UBICACIONES.map(u => opt(u, u, 'Stand')).join('')}</select></label><label class="f">Hacia la sede<select id="ls">${otras.map(x => opt(x.codigo, x.nombre, otras[0].codigo)).join('')}</select></label>` : ''}
      ${mode === 'CONTEO' ? `<label class="f">Motivo<select id="lm">${['Conteo físico','Rotura','Pérdida','Error de captura','Otro'].map(x => opt(x, x, 'Conteo físico')).join('')}</select></label>` : ''}
      <label class="f" style="flex:1;min-width:200px">Nota<input type="text" id="ln" placeholder="Opcional"></label>
    </div>
    <div class="row" style="margin:10px 0"><input type="search" id="lq" placeholder="🔍 Buscar…" style="flex:1;width:auto;min-width:200px"></div>
    <div id="lc"></div>
    <div class="tw" style="max-height:46vh;margin-top:8px"><table class="t"><thead><tr><th>Producto</th><th>Color</th><th class="n">${mode.startsWith('TRASPASO') ? 'En origen' : 'Sistema'}</th><th class="n" style="width:130px">${mode === 'CONTEO' ? 'Contado' : 'Cantidad'}</th>${mode === 'CONTEO' ? '<th class="n">Dif.</th>' : ''}</tr></thead><tbody id="lb"></tbody></table></div>
    <div class="row between" style="margin-top:12px"><div id="lres" class="b"></div><button class="btn pri big" id="lok">Guardar</button></div>`, {wide:true});
  const origen = () => mode.startsWith('TRASPASO') ? val('#lu', m) : 'Stand';
  const disp = vid => mode.startsWith('TRASPASO') ? stockOf(vid)[origen()] : stockOf(vid).total;
  const drawChips = () => { $('#lc', m).innerHTML = catChips(L.cat, 'x'); $$('#lc .chip', m).forEach(b => b.onclick = e => { e.stopPropagation(); e.preventDefault(); L.cat = b.dataset.v; drawChips(); draw(); }); };
  const resumen = () => {
    let piezas = 0, n = 0;
    for (const [vid, q] of L.q){ if (q === '' || q == null) continue; const d = mode === 'CONTEO' ? num(q) - stockOf(vid).total : num(q); if (d){ piezas += mode === 'CONTEO' ? d : Math.abs(d); n++; } }
    $('#lres', m).textContent = mode === 'CONTEO' ? `${n} variante(s) con diferencia · neto ${piezas > 0 ? '+' : ''}${int(piezas)} pzs` : `${n} variante(s) · ${int(piezas)} pieza(s)`;
  };
  const draw = () => {
    const Q = norm(L.search);
    const vs = S.variantes.map(v => ({v, p:IDX.prod.get(v.producto_id)})).filter(x => x.p && (L.cat === 'Todas' || x.p.categoria === L.cat)
      && (mode === 'ENTRADA' || mode === 'CONTEO' || disp(x.v.id) > 0 || L.q.get(x.v.id))
      && (!Q || Q.split(' ').every(w => norm(x.p.nombre + ' ' + x.p.clave + ' ' + x.v.color).includes(w))))
      .sort((a,b) => a.p.nombre.localeCompare(b.p.nombre) || a.v.color.localeCompare(b.v.color));
    $('#lb', m).innerHTML = vs.map(({v,p}) => { const q = L.q.get(v.id) ?? ''; const d = mode === 'CONTEO' && q !== '' ? num(q) - stockOf(v.id).total : null;
      return `<tr><td><b>${esc(p.nombre)}</b><div class="small muted">${esc(p.clave)}</div></td><td>${esc(v.color)}</td><td class="n">${int(disp(v.id))}</td>
      <td class="n"><input type="number" inputmode="numeric" min="0" data-lv="${v.id}" value="${esc(q)}" style="text-align:right"></td>${mode === 'CONTEO' ? `<td class="n ${d < 0 ? 'neg' : d > 0 ? 'pos' : ''}" data-ld="${v.id}">${d == null ? '' : (d > 0 ? '+' : '') + int(d)}</td>` : ''}</tr>`; }).join('') || '<tr><td colspan="5" class="empty">Sin piezas para mostrar</td></tr>';
    $$('[data-lv]', m).forEach(inp => inp.oninput = () => { L.q.set(inp.dataset.lv, inp.value); if (mode === 'CONTEO'){ const d = inp.value === '' ? null : num(inp.value) - stockOf(inp.dataset.lv).total; const td = $(`[data-ld="${inp.dataset.lv}"]`, m); td.textContent = d == null ? '' : (d > 0 ? '+' : '') + int(d); td.className = 'n ' + (d < 0 ? 'neg' : d > 0 ? 'pos' : ''); } resumen(); });
    resumen();
  };
  $('#lq', m).oninput = debounce(e => { L.search = e.target.value; draw(); }, 150);
  if (mode.startsWith('TRASPASO')) $('#lu', m).onchange = draw;
  drawChips(); draw();
  $('#lok', m).onclick = async () => {
    const fecha = val('#lf', m); const fh = fecha ? new Date(fecha).toISOString() : nowISO(); const nota = val('#ln', m);
    const movs = []; const errores = [];
    for (const [vid, raw] of L.q){
      if (raw === '' || raw == null) continue; const q = Math.round(num(raw)); const p = prodOfVar(vid);
      if (q < 0){ errores.push(`${varLabel(vid)}: cantidad negativa`); continue; }
      const base = {id:uuid(), fecha_hora:fh, variante_id:vid, producto_id:p.id, precio_venta_unit:precioVenta(p), precio_fabricante_unit:num(p.precio_fabricante), nota};
      if (mode === 'TRASPASO_SEDE' && q > 0){ const o = origen(), dest = val('#ls', m), tid = uuid();
        if (q > stockOf(vid)[o]) errores.push(`${varLabel(vid)}: en ${o} hay ${int(stockOf(vid)[o])}`);
        else movs.push({...base, id:uuid(), tipo:'TRASPASO_SEDE', cantidad:-q, ubicacion:o, sede_codigo:vista(), sede_destino:dest, traspaso_id:tid},
                       {...base, id:uuid(), tipo:'TRASPASO_SEDE', cantidad:q, ubicacion:'Stand', sede_codigo:dest, sede_origen:vista(), traspaso_id:tid}); }
      if (mode === 'ENTRADA' && q > 0) movs.push({...base, tipo:'ENTRADA', cantidad:q, ubicacion:val('#lu', m)});
      if (mode === 'DEVOLUCION' && q > 0){ if (q > stockOf(vid).total) errores.push(`${varLabel(vid)}: quedan ${int(stockOf(vid).total)}`); else { const s = stockOf(vid); movs.push({...base, tipo:'DEVOLUCION', cantidad:q, ubicacion: s.Stand >= q ? 'Stand' : 'Casa'}); } }
      if (mode === 'TRASPASO' && q > 0){ const o = origen(); if (q > stockOf(vid)[o]) errores.push(`${varLabel(vid)}: en ${o} hay ${int(stockOf(vid)[o])}`); else movs.push({...base, tipo:'TRASPASO', cantidad:q, ubicacion:o, ubicacion_destino: o === 'Stand' ? 'Casa' : 'Stand'}); }
      if (mode === 'CONTEO'){ const d = q - stockOf(vid).total; if (d) movs.push({...base, tipo:'AJUSTE', cantidad:d, ubicacion:'Stand', motivo:val('#lm', m) || 'Conteo físico'}); }
    }
    if (errores.length){ alertDlg('No hay suficientes piezas', errores.map(esc).join('<br>')); return; }
    if (!movs.length){ toast('No escribiste ninguna cantidad.'); return; }
    await put('movimientos', movs); closeModal();
    toast(`✅ Guardado: ${movs.length} movimiento(s)`); if (UI.screen === 'inventario') rerender();
  };
}

    <button class="btn pri" data-a="importar">📥 Cargar inventario de una sede</button>
    <button class="btn ghost" data-a="nuevoProd">➕ Nuevo producto</button>

  </div>
  <div class="card">
    <input type="search" placeholder="🔍 Buscar…" value="${esc(UI.cq)}" data-i="cq" style="margin-bottom:10px">

SCREENS.catalogo_after = () => renderCatTabla();
function renderCatTabla(){

  $('#ctb').innerHTML = ps.map(p => `<tr class="click" data-a="editProd" data-p="${p.id}"><td class="small">${esc(p.clave)}</td><td>${esc(p.nombre)}${p.desglose ? `<div class="small muted">costo ${esc(p.desglose)}</div>` : ''}</td><td>${esc(p.categoria)}</td>
    <td class="n">${money(p.precio_fabricante)}</td><td class="n">${money(p.precio_sugerido)}</td><td class="n b ${num(p.precio_venta) < num(p.precio_sugerido) ? 'neg' : ''}">${money(p.precio_venta)}</td>
    <td class="n">${(IDX.varsByProd.get(p.id) || []).length}</td><td class="n">${int(stockProd(p.id))}</td>

}

      <div class="grid g2">${sedes().map(x => `<label class="f">${esc(x.nombre)}<input type="number" inputmode="decimal" data-psede="${esc(x.codigo)}" value="${num((p.precios_sede || {})[x.codigo]) || ''}" placeholder="Igual al precio de venta"></label>`).join('')}</div></details>

      <label class="btn ghost sm">📷 Foto<input type="file" accept="image/*" id="pfoto" hidden></label><span id="pfprev">${p.foto ? `<img src="${esc(p.foto)}" style="height:48px;border-radius:8px;vertical-align:middle"> <button class="btn sm ghost" id="pfdel">Quitar foto</button>` : ''}</span>

  const warn = () => { const f = num(val('#pf', m)), s = num(val('#ps', m)), v = num(val('#pv', m));
    $('#pw', m).innerHTML = v < f ? `<div class="alert bad">🔴 El precio de venta es menor al de fabricante: perderías ${money(f - v)} por pieza.</div>` : v < s ? `<div class="alert warn">⚠️ El precio de venta es menor al sugerido (${money(s)}).</div>` : f ? `<div class="alert ok">Margen por pieza: ${money(v - f)} · sobreprecio vs sugerido: ${money(v - s)}</div>` : ''; };

  const drawVars = () => { $('#pvars', m).innerHTML = (vars.length + nuevosColores.length) ? `<div class="chips">${vars.map(v => `<span class="chip ${v.activo === false ? '' : 'on'}" data-tv="${v.id}" title="Tocar para activar/desactivar">${esc(v.color)} · ${int(stockOf(v.id).total)}</span>`).join('')}${nuevosColores.map(c => `<span class="chip on">${esc(c)} (nuevo)</span>`).join('')}</div><div class="small muted">Toca un color para activarlo o desactivarlo.</div>` : '<div class="muted">Sin colores todavía. Agrega al menos uno.</div>';

      ${r.map((c, i) => `<tr><td><select data-rt="${i}">${TIPOS_PARTE.map(t => opt(t, t, c.tipo)).join('')}</select></td><td><input type="text" data-rd="${i}" value="${esc(c.descripcion || '')}"></td>
        <td><input type="number" inputmode="decimal" data-rc="${i}" value="${c.costo_fabricante ?? ''}" placeholder="capturar" style="width:110px;text-align:right"></td>
        <td><input type="text" data-rs="${i}" value="${esc(c.suelto || '')}" placeholder="Ej. ARETE CUADRADO SENCILLO DICROICO" list="dlprods"></td>
        <td><button class="btn sm ghost" data-rx="${i}">✕</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted">Sin componentes.</td></tr>'}
      </tbody></table></div><datalist id="dlprods">${S.productos.filter(x => !esJuego(x)).map(x => `<option value="${esc(x.nombre)}">`).join('')}</datalist>
      <div class="row" style="margin-top:8px"><button class="btn sm ghost" id="radd">➕ Agregar componente</button>${presetPara(tmp) ? '<button class="btn sm ghost" id="rpre">↺ Receta precargada</button>' : ''}</div>
      ${a ? `<div class="alert ${a.tipo === 'ok' ? 'ok' : a.tipo === 'dif' ? 'warn' : 'info'}">${a.tipo === 'ok' ? '✅ ' : a.tipo === 'dif' ? '⚠️ ' : ''}${esc(a.txt)}${a.tipo !== 'falta' ? ` Suma: ${money(sum(r, c => c.costo_fabricante))} · juego: ${money(tmp.precio_fabricante)}` : ''}</div>` : ''}`;
    $$('[data-rt]', m).forEach(e => e.onchange = () => { receta[+e.dataset.rt].tipo = e.value; drawReceta(); });
    $$('[data-rd]', m).forEach(e => e.onchange = () => { receta[+e.dataset.rd].descripcion = e.value.trim(); });
    $$('[data-rc]', m).forEach(e => e.onchange = () => { receta[+e.dataset.rc].costo_fabricante = e.value === '' ? null : num(e.value); drawReceta(); });
    $$('[data-rs]', m).forEach(e => e.onchange = () => { const v = cleanTxt(e.value); if (v) receta[+e.dataset.rs].suelto = v; else delete receta[+e.dataset.rs].suelto; });
    $$('[data-rx]', m).forEach(e => e.onclick = () => { receta.splice(+e.dataset.rx, 1); drawReceta(); });
    $('#radd', m).onclick = () => { receta = receta || []; receta.push({tipo: receta.length ? 'Aretes' : 'Dije', descripcion:'', costo_fabricante:null}); drawReceta(); };
    if ($('#rpre', m)) $('#rpre', m).onclick = () => { receta = presetPara(tmp).r.map(([tipo, descripcion, costo, suelto]) => ({tipo, descripcion, costo_fabricante:costo, ...(suelto ? {suelto} : {})})); drawReceta(); };
  };
  drawReceta(); $('#pk', m).addEventListener('change', drawReceta); $('#pf', m).addEventListener('input', drawReceta);
  $('#addcol', m).onclick = () => { const c = cleanTxt(val('#ncol', m)); if (!c) return; if (vars.some(v => v.color === c) || nuevosColores.includes(c)){ toast('Ese color ya existe.'); return; } nuevosColores.push(c); $('#ncol', m).value = ''; drawVars(); };
  $('#pfoto', m).onchange = async e => { const f = e.target.files[0]; if (!f) return; p.foto = await reducirFoto(f); $('#pfprev', m).innerHTML = `<img src="${p.foto}" style="height:48px;border-radius:8px;vertical-align:middle">`; };
  if ($('#pfdel', m)) $('#pfdel', m).onclick = () => { p.foto = ''; $('#pfprev', m).innerHTML = ''; };
  $('#pok', m).onclick = async () => {
    const nombre = cleanTxt(val('#pn', m)); if (!nombre){ toast('Falta el nombre.'); return; }
    if (!pid && !nuevosColores.length) nuevosColores.push('ÚNICO');
    Object.assign(p, {clave: cleanTxt(val('#pc', m)) || claveDesdeNombre(nombre), nombre, categoria: val('#pk', m), precio_fabricante: num(val('#pf', m)), precio_sugerido: num(val('#ps', m)), precio_venta: num(val('#pv', m)),
      desglose: val('#pd', m).trim(), nota: val('#pnt', m).trim(), activo: $('#pa', m).checked,
      precios_sede: Object.fromEntries($$('[data-psede]', m).filter(i => num(i.value) > 0).map(i => [i.dataset.psede, num(i.value)]))});
    if (receta !== undefined) p.receta = receta.filter(c => c.descripcion || num(c.costo_fabricante) > 0);
    if ($('#prv', m)) p.revisar = $('#prv', m).checked;
    if (p.precio_venta < p.precio_fabricante && !await confirmDlg({titulo:'🔴 Precio abajo del costo', msg:'El precio de venta es menor al de fabricante. ¿Guardar así?', danger:true})) return;
    await putMany({productos:[p], variantes:[...vars.filter(v => v._tog).map(v => { delete v._tog; return v; }), ...nuevosColores.map(c => ({id:uuid(), producto_id:p.id || (p.id = uuid()), color:c, activo:true}))]});
    closeModal(); toast('✅ Producto guardado'); if (UI.screen === 'catalogo') renderCatTabla(); else rerender();
  };
  if ($('#pdel', m)) $('#pdel', m).onclick = async () => {
    const tiene = S.movimientos.some(x => x.producto_id === pid);
    if (tiene){ alertDlg('No se puede borrar', 'Este producto ya tiene movimientos. Mejor desactívalo (quita la palomita de "Activo").'); return; }
    if (!await confirmDlg({titulo:'¿Borrar producto?', msg:`Se borrará "${esc(p.nombre)}" y sus colores.`, ok:'Sí, borrar', danger:true})) return;
    await del('variantes', vars.map(v => v.id)); await del('productos', pid); closeModal(); toast('Producto borrado'); rerender();
  };
}
function reducirFoto(file){
  return new Promise(res => { const img = new Image(); img.onload = () => { const s = Math.min(1, 240 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', .75)); }; img.src = URL.createObjectURL(file); });
}

/* ajuste masivo de precios */
A.masivo = () => {
  const st = {alcance:'cat', cat: catsEnUso()[0] || 'Aretes', modo:'pct', valor:20, redondeo:10, sel:new Set()};
  const m = modal(`${mhead('💲 Ajuste masivo de precios')}<div id="mb"></div>`, {wide:true});
  const nuevo = p => { if (st.modo === 'sug') return num(p.precio_sugerido); let v = st.modo === 'pct' ? num(p.precio_sugerido) * (1 + num(st.valor) / 100) : num(p.precio_sugerido) + num(st.valor); if (st.redondeo) v = Math.round(v / st.redondeo) * st.redondeo; return r2(v); };
  const lista = () => S.productos.filter(p => st.alcance === 'todos' || (st.alcance === 'cat' && p.categoria === st.cat) || (st.alcance === 'sel' && st.sel.has(p.id)));
  const draw = () => {
    const ps = lista();
    $('#mb', m).innerHTML = `<div class="grid g2">
      <label class="f">¿A cuáles?<select id="ma">${opt('cat','Una categoría',st.alcance)}${opt('todos','Todos los productos',st.alcance)}${opt('sel','Elegir productos',st.alcance)}</select></label>
      ${st.alcance === 'cat' ? `<label class="f">Categoría<select id="mc">${catsEnUso().map(c => opt(c, c, st.cat)).join('')}</select></label>` : '<div></div>'}
      <label class="f">¿Qué hacer?<select id="mm">${opt('pct','Subir un % sobre el sugerido',st.modo)}${opt('monto','Subir un monto fijo sobre el sugerido',st.modo)}${opt('sug','Regresar al precio sugerido',st.modo)}</select></label>
      ${st.modo !== 'sug' ? `<label class="f">${st.modo === 'pct' ? 'Porcentaje (%)' : 'Monto ($)'}<input type="number" inputmode="decimal" id="mv" value="${st.valor}"></label>` : '<div></div>'}
      ${st.modo !== 'sug' ? `<label class="f">Redondear a<select id="mr">${opt(0,'Sin redondeo',st.redondeo)}${opt(5,'Múltiplos de $5',st.redondeo)}${opt(10,'Múltiplos de $10',st.redondeo)}</select></label>` : ''}
    </div>
    <div class="alert info">El precio nuevo se calcula sobre el <b>precio sugerido</b> de cada producto. A Fabiola se le sigue pagando el precio de fabricante.</div>
    <div class="tw" style="max-height:42vh"><table class="t"><thead><tr>${st.alcance === 'sel' ? '<th></th>' : ''}<th>Producto</th><th class="n">Fabricante</th><th class="n">Sugerido</th><th class="n">Actual</th><th class="n">Nuevo</th></tr></thead><tbody>
      ${(st.alcance === 'sel' ? S.productos : ps).map(p => `<tr>${st.alcance === 'sel' ? `<td><input type="checkbox" data-ms="${p.id}" ${st.sel.has(p.id) ? 'checked' : ''}></td>` : ''}<td>${esc(p.nombre)}</td><td class="n">${money(p.precio_fabricante)}</td><td class="n">${money(p.precio_sugerido)}</td><td class="n">${money(p.precio_venta)}</td><td class="n b">${st.alcance !== 'sel' || st.sel.has(p.id) ? money(nuevo(p)) : ''}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="row between" style="margin-top:12px"><b>${ps.length} producto(s) cambiarán</b><button class="btn pri big" id="mok" ${ps.length ? '' : 'disabled'}>Aplicar</button></div>`;
    $('#ma', m).onchange = e => { st.alcance = e.target.value; draw(); };
    if ($('#mc', m)) $('#mc', m).onchange = e => { st.cat = e.target.value; draw(); };
    $('#mm', m).onchange = e => { st.modo = e.target.value; draw(); };
    if ($('#mv', m)) $('#mv', m).onchange = e => { st.valor = num(e.target.value); draw(); };
    if ($('#mr', m)) $('#mr', m).onchange = e => { st.redondeo = num(e.target.value); draw(); };
    $$('[data-ms]', m).forEach(c => c.onchange = () => { c.checked ? st.sel.add(c.dataset.ms) : st.sel.delete(c.dataset.ms); draw(); });
    $('#mok', m).onclick = async () => {
      const ps2 = lista(); const bajo = ps2.filter(p => nuevo(p) < num(p.precio_fabricante));
      if (bajo.length && !await confirmDlg({titulo:'🔴 Precios abajo del costo', msg:`${bajo.length} producto(s) quedarían abajo del precio de fabricante. ¿Continuar?`, danger:true})) return;
      await put('productos', ps2.map(p => ({...p, precio_venta:nuevo(p)}))); closeModal(); toast(`✅ ${ps2.length} precio(s) actualizado(s)`); rerender();
    };
  };
  draw();
};

/* importación */

    };

        <div class="kpi"><div class="l">Valor a precio de fabricante</div><div class="v">${money(tp.valor)}</div><div class="s">de esta carga</div></div>
        <div class="kpi"><div class="l">Productos nuevos en catálogo</div><div class="v">${tp.nuevos}</div><div class="s">${tp.coloresNuevos} color(es) nuevo(s) · ${t.sinClave} sin clave</div></div>

      ${[...an.variantes.filter(v => v.revisar || nuevos.has(`${v.clave}|${v.nombre}|${v.costo}`)), ...an.variantes.slice(0, 40)].map(v => `<tr><td>${v.fila}</td><td>${esc(v.clave)}${v.revisar ? ' <span class="pill warn">revisar</span>' : ''}${nuevos.has(`${v.clave}|${v.nombre}|${v.costo}`) ? ' <span class="pill ok">nuevo</span>' : ''}</td><td>${esc(v.nombre)}</td><td>${esc(v.color)}</td><td>${esc(v.categoria)}</td><td class="n">${v.piezas}</td><td class="n">${money(v.costo)}${v.desglose ? `<div class="small muted">${esc(v.desglose)}</div>` : ''}</td><td class="n">${money(v.sugerido)}</td><td class="small">${esc(v.nota)}</td></tr>`).join('')}

      $$('[data-hf]', m).forEach(i => o.fechas[i.dataset.hf] = i.value); $$('[data-hs]', m).forEach(i => o.stand[i.dataset.hs] = num(i.value)); $$('[data-hu]', m).forEach(i => o.uber[i.dataset.hu] = num(i.value));
      const fechas = Object.values(o.fechas).sort(); if (hist && fechas.length) o.fechaCarga = localDate();
      $('#imok', m).disabled = true; $('#imok', m).textContent = 'Importando…';

};

async function flujoBorrarEvento(eid){
  const e = IDX.ev.get(eid); if (!e) return; const c = contenidoEvento(eid);
  if (c.cortes.length){ alertDlg('No se puede borrar', `Este evento tiene ventas liquidadas en el corte folio <b>${c.cortes.map(x => esc(x.folio || x.id.slice(0, 8))).join(', ')}</b>. Primero cancela ese corte.`); return; }
  if (c.vacio){ if (!await confirmDlg({titulo:'¿Borrar evento?', msg:`"${esc(e.nombre)}" no tiene ventas ni gastos.`, ok:'Sí, borrar', danger:true})) return; }
  else {
    const partes = [c.nVentas ? `${c.nVentas} venta(s) por ${money(c.venta)}` : '', c.gastos.length ? `${c.gastos.length} gasto(s) por ${money(c.montoGastos)}` : '', c.separaciones ? `${c.separaciones} separación(es) de juego` : ''].filter(Boolean);
    const ok = await new Promise(res => {
      const m = modal(`${mhead('🗑️ Borrar evento')}<div class="stack"><div><b>${esc(e.nombre)}</b> (${esc(sedeNombre(e.sede_codigo))}) tiene ${partes.join(', ').replace(/, ([^,]*)$/, ' y $1') || c.movs.length + ' movimiento(s)'}.</div>
        <div class="alert warn">Se revierten las ventas (las piezas regresan a la existencia de su sede y ubicación), se deshacen las separaciones de juegos y se borran sus gastos. Antes se guarda un respaldo automático.</div>
        <label class="f">Para confirmar escribe <b>BORRAR</b><input type="text" id="bconf" autocomplete="off" autofocus></label>
        <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="bno">Cancelar</button><button class="btn bad" id="bsi" disabled>Borrar evento y todo lo que tiene</button></div></div>`, {onClose:() => res(false)});
      $('#bconf', m).oninput = ev => { $('#bsi', m).disabled = ev.target.value.trim().toUpperCase() !== 'BORRAR'; };
      $('#bno', m).onclick = () => closeModal();
      $('#bsi', m).onclick = () => { _modals.pop().remove(); res(true); };
    });
    if (!ok) return;
    try { const txt = JSON.stringify(snapshot()); await tx(['meta'],'readwrite', t => t.objectStore('meta').put({id:'antes_borrar_evento', fecha:nowISO(), json:txt}));
      download('ALIKA_ANTES_DE_BORRAR_EVENTO_' + nombreRespaldo().replace('ALIKA_', ''), txt, 'application/json'); } catch(err){}
  }
  try { const r = await borrarEvento(eid); closeAll(); toast(r.activo ? '🗑️ Evento borrado. Era el evento de venta: elige otro en Vender.' : '🗑️ Evento borrado'); render(); }
  catch (err){ alertDlg('No se pudo borrar', esc(err.message)); }
}

A.cerrarEvento = async el => {
  const e = IDX.ev.get(el.dataset.e);

  e.estado = 'Cerrado'; if (!e.fecha_fin) e.fecha_fin = localDate(); await put('eventos', e);

function editarEvento(eid, {rapido = false} = {}){

  const m = modal(`${mhead((eid ? 'Editar evento' : 'Nuevo evento') + ' · ' + esc(sedeNombre(e.sede_codigo || vista())))}<div class="grid g2">
    <label class="f">Nombre *<input type="text" id="en" value="${esc(e.nombre)}" placeholder="Ej. Mercadito Jurica" autofocus></label>
    <label class="f">Tipo<select id="et">${TIPOS_EVENTO.map(t => opt(t, t, e.tipo)).join('')}</select></label>
    <label class="f">Fecha de inicio<input type="date" id="ei" value="${e.fecha_inicio || ''}"></label>
    <label class="f">Fecha de fin<input type="date" id="ef" value="${e.fecha_fin || ''}"></label>
    <label class="f">Costo del lugar (cuota / renta)<input type="number" inputmode="decimal" id="ec" value="${num(e.costo_lugar)}"></label>
    <label class="f">Estado<select id="ee">${ESTADOS_EVENTO.map(t => opt(t, t, e.estado)).join('')}</select></label></div>
    <div class="small muted" style="margin-top:6px">El costo del lugar se registra automáticamente como gasto "Lugar / cuota" del evento.</div>
    <div class="row between" style="margin-top:16px">${eid ? '<button class="btn bad" id="edel">🗑️ Borrar</button>' : '<span></span>'}<button class="btn pri big" id="eok">Guardar</button></div>`);
  $('#eok', m).onclick = async () => {
    const nombre = val('#en', m).trim(); if (!nombre){ toast('Falta el nombre.'); return; }
    Object.assign(e, {nombre, tipo:val('#et', m), fecha_inicio:val('#ei', m), fecha_fin:val('#ef', m) || val('#ei', m), costo_lugar:num(val('#ec', m)), estado:val('#ee', m)});
    if (!e.id) e.id = uuid();
    const gl = S.gastos.find(g => g.evento_id === e.id && g.auto_lugar);
    const gastos = [];

/* =========================================================================
   CALCULADORA DE UTILIDAD (no guarda datos)
   ========================================================================= */
function calcular(c, piezasOverride, precioOverride){
  const factor = num(S.config.factor_precio_sugerido) || 2;
  const fab = num(c.fab), sugerido = r2(fab * factor);
  const precio = precioOverride != null ? precioOverride : (c.precio != null && c.precio !== '' ? num(c.precio) : r2(sugerido * (1 + num(c.extraPct) / 100)));
  const final = r2(precio * (1 - num(c.descPct) / 100));
  const comPct = c.comPct == null || c.comPct === '' ? num(S.config.comision_tarjeta_pct) : num(c.comPct);
  const comPieza = final * num(c.tarjetaPct) / 100 * comPct / 100;
  const margenPieza = final - fab - comPieza;
  const piezas = piezasOverride != null ? piezasOverride : num(c.piezas);
  const gastosFijos = num(c.lugar) + num(c.transporte) + num(c.otros);
  const venta = final * piezas, pagoFab = fab * piezas, comisiones = comPieza * piezas;
  const margenBruto = venta - pagoFab;
  const utilidad = margenBruto - comisiones - gastosFijos;
  const peP = margenPieza > 0 ? gastosFijos / margenPieza : null;
  const margenPct = final ? margenPieza / final : 0;
  return {fab, sugerido, precio, final, margenPieza, piezas, venta, pagoFab, margenBruto, comisiones, gastosFijos, utilidad, peP, peRound: peP == null ? null : Math.ceil(peP - 1e-9), pe$: peP == null ? null : (margenPct > 0 ? gastosFijos / margenPct : null), extra: (precio - sugerido) * piezas, descPieza: precio - final};
}

/* tabla con una columna por sede y el total para cada métrica. items deben traer su sede (sede_codigo) */
function tablaPorSede(items, {sedeFn = x => x.sede_codigo, keyFn, keyCells, keyCols, metrics, totalLabel = 'TOTAL'}){
  const sc = sedesCodigos(); const map = new Map();
  for (const it of items){ const k = keyFn(it); if (!map.has(k)) map.set(k, {cells:keyCells(it), v:{}}); const row = map.get(k); const sd = sedeFn(it);
    metrics.forEach((mt, i) => { const key = i + '|' + sd; row.v[key] = (row.v[key] || 0) + num(mt.val(it)); }); }
  const vals = r => metrics.flatMap((mt, i) => { const vs = sc.map(c => r.v[i + '|' + c] || 0); return [...vs, sum(vs)]; });
  const cols = [...keyCols, ...metrics.flatMap(mt => [...sc.map(c => ({t:`${mt.t} ${c}`, f:mt.f})), {t:`${mt.t} total`, f:mt.f}])];
  const rows = [...map.values()].filter(r => Object.values(r.v).some(x => x)).map(r => ({c:[...r.cells, ...vals(r)]}));
  const tot = {v:{}}; for (const r of map.values()) for (const [k, x] of Object.entries(r.v)) tot.v[k] = (tot.v[k] || 0) + x;
  rows.push({c:[totalLabel, ...keyCols.slice(1).map(() => ''), ...vals(tot)], cls:'tot'});
  return {cols, rows};
}

    const t = tablaPorSede(items, {keyFn:x => x.v.id, keyCells:x => [x.p.clave, x.p.nombre, x.v.color], keyCols:[{t:'Clave'},{t:'Producto'},{t:'Color'}],

  },
  conteo(f){
    const items = [];
    const vs = S.variantes.map(v => ({v, p:IDX.prod.get(v.producto_id)})).filter(x => x.p && x.p.activo !== false && (!f.cat || x.p.categoria === f.cat))

  ventasDia(f){
    const movs = filtroVentas(f).sort((a,b) => a.fecha_hora.localeCompare(b.fecha_hora));
    const t = tablaPorSede(movs, {keyFn:m => dayOf(m.fecha_hora), keyCells:m => [fdate(dayOf(m.fecha_hora))], keyCols:[{t:'Día'}],

  ventasProducto(f){

    movs.sort((a,b) => (orden.get(a.producto_id) ?? 0) - (orden.get(b.producto_id) ?? 0));

  gastosCategoria(f){

  resultados(f){

    const movs = filtroVentas(f).filter(m => !m.corte_id).sort((a,b) => String(IDX.prod.get(a.producto_id)?.nombre).localeCompare(String(IDX.prod.get(b.producto_id)?.nombre)));

    <div class="grid g2">
      <div class="card"><h3>🔁 Reemplazar todo</h3><p class="small">Borra lo de este equipo y deja exactamente lo del respaldo. Antes se descarga automáticamente un respaldo de lo actual.</p><button class="btn bad" id="rrep">Reemplazar todo</button></div>
      <div class="card"><h3>➕ Fusionar</h3><p class="small">Une ambos sin duplicar (por ID único). Si un registro está en los dos, gana el más reciente.</p><button class="btn pri" id="rfus">Fusionar</button></div>
    </div></div>`, {wide:true});
  $('#rrep', m).onclick = async () => {
    if (!await confirmDlg({titulo:'¿Reemplazar todo?', msg:'Se descargará primero un respaldo de lo que hay ahora en este equipo y luego se reemplazará con el archivo elegido.', ok:'Sí, reemplazar', danger:true})) return;

/* ---- versión nueva: aviso + botón Actualizar (nunca borra IndexedDB: solo service worker y cachés de la app) ---- */
function cmpVer(a, b){ const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++){ if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); } return 0; }
async function actualizarApp(){
  try { const regs = await navigator.serviceWorker?.getRegistrations?.() || []; for (const r of regs) await r.unregister(); } catch(e){}
  try { for (const k of await caches.keys()) if (k.startsWith('alika-')) await caches.delete(k); } catch(e){}
  location.reload();
}
function avisoVersion(v){
  if ($('#upd')) return;
  const d = document.createElement('div'); d.id = 'upd'; d.className = 'toast'; d.style.cssText = 'top:12px;bottom:auto;background:#1f4e52;z-index:70';
  d.innerHTML = `<span>✨ Hay una versión nueva${v ? ' (v' + esc(v) + ')' : ''}</span><button>Actualizar</button>`;
  d.querySelector('button').onclick = actualizarApp; document.body.appendChild(d);
}
async function revisarVersion(){
  if (!location.protocol.startsWith('http')) return;
  try { const t = await (await fetch('index.html?v=' + Date.now(), {cache:'no-store'})).text(); const m = /APP_VERSION = '([\d.]+)'/.exec(t);
    if (m && cmpVer(m[1], APP_VERSION) > 0) avisoVersion(m[1]); } catch(e){}
}
async function init(){
  try { await openDB(); await loadAll(); }
  catch (e){
    if (e && e.name === 'VersionError'){ $('#main').innerHTML = `<div class="card"><h2>✨ Hay una versión nueva</h2><p>Este equipo tiene guardada una versión anterior de la app. Toca <b>Actualizar</b>: se borra solo la copia vieja de la app; <b>tus datos no se tocan</b>.</p><button class="btn pri big" id="vupd">Actualizar</button></div>`; $('#vupd').onclick = actualizarApp; return; }
    $('#main').innerHTML = `<div class="card alert bad"><h2>No se pudo abrir el almacenamiento</h2><p>${esc(e.message || e)}</p><p>Si abriste el archivo en Chrome para Android desde la memoria/USB, usa la versión publicada (ver LEEME). En laptop, usa Chrome o Edge.</p></div>`; return; }
  try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch(e){}
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
    const habiaControl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(r => r.update && r.update()).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (habiaControl) revisarVersion(); });
    setTimeout(revisarVersion, 4000); setInterval(revisarVersion, 30 * 60000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') revisarVersion(); });
  }
  let mig = null;
  try { mig = await migrarLocal(); await migrarLocalV3(); await aplicarRecetasPrecargadas(); }
  catch (e){ $('#main').innerHTML = `<div class="card alert bad"><h2>No se pudo actualizar los datos</h2><p>${esc(e.message || e)}</p><p>Tus datos no se modificaron. Guarda un respaldo con la versión anterior y avísanos.</p></div>`; return; }
  aplicarSedeVisual();
  render();
  if (mig && mig.hayDatos) alertDlg('✅ App actualizada: varias sedes', `Ahora este equipo puede manejar <b>Querétaro</b> y <b>Mérida</b>. Todos tus datos (${int(mig.registros)} registros) quedaron asignados a <b>Querétaro (QRO)</b>, sin perder nada.<br><br>Antes de actualizar se guardó un respaldo automático${mig.archivo ? ` (<b>${esc(mig.archivo)}</b>, en Descargas)` : ''}; también lo puedes bajar en <b>Respaldo → Respaldo previo a la actualización</b>.<br><br>Usa el selector de arriba para cambiar de sede.`);
  const tieneDatos = S.movimientos.length || S.gastos.length; const ult = S.config.ultimo_respaldo;
  if (tieneDatos && (!ult || Date.now() - new Date(ult) > 24*3600000)) setTimeout(() => toast(`💾 Último respaldo: ${hace(ult)}. Te recomendamos respaldar.`, {accion:'Respaldar', ms:8000, fn:() => A.respaldoRapido()}), 800);
}

window.ALIKA = {S, IDX, readXlsx, parseCSV, analizarImport, aplicarImport, leerPrecios, leerCasa, guessHeaderRow, guessMapping, resultados, inventarioTotales, stockOf, calcular, snapshot, cargarRespaldo, validarRespaldo, put, del, clearAll, kardexRows, REP, REP1,
  migrarSnapshot, migrarLocal, migrarLocalV3, aplicarRecetasPrecargadas, recetaEfectiva, avisoReceta, precioParte, construirSeparacion, deshacerMovs, contenidoEvento, borrarEvento, planImport, totalesPlan, cmpVer, actualizarApp, generarCorte, pagarCorte, cancelarCorte, pendientesCorte, saveConfig, sedesCodigos, vista, loadAll, respaldoPremigracion};
init();
