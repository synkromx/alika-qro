<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Alika · Inventario y Ventas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f2ec; --card:#fff; --ink:#1f2a30; --muted:#5f6b70; --line:#e2dbd1;
  --pri:#1f4e52; --pri2:#2c6a6f; --acc:#b8642f; --ok:#2e7d4f; --warn:#b7791f; --bad:#b3261e;
  --okbg:#e6f3ea; --warnbg:#fdf3dc; --badbg:#fbe7e5; --pribg:#e4eeee;
  --r:14px; --tap:52px; --shadow:0 1px 3px rgba(0,0,0,.08),0 2px 10px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 .5em;line-height:1.2}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.08rem}
a{color:var(--pri)}
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:12px 14px 96px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.topbar .brand{font-weight:800;font-size:1.25rem;color:var(--pri);letter-spacing:.5px}
.topbar .sede{background:var(--pribg);color:var(--pri);border-radius:999px;padding:4px 12px;font-size:.9rem;font-weight:600}
.topbar .grow{flex:1}
body{border-top:6px solid var(--sede,#1f4e52)}
.topbar.sedebar{background:var(--sede);color:#fff;border-radius:16px;padding:8px 12px}
.topbar.sedebar .brand{color:#fff}
.topbar.sedebar .sede{background:rgba(255,255,255,.2);color:#fff;font-size:1rem}
.topbar.sedebar .pill{background:rgba(255,255,255,.92)}
.sedesel{display:flex;background:rgba(0,0,0,.18);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.sedesel button{border:0;background:transparent;color:#fff;font-weight:700;min-height:44px;padding:6px 14px;border-radius:9px;cursor:pointer;font-size:.95rem}
.sedesel button.on{background:#fff;color:var(--c)}
.sedetag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.78rem;font-weight:800;color:#fff;background:var(--c,#666)}
.bnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;border:0;background:none;padding:8px 2px 10px;min-height:64px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem;color:var(--muted);cursor:pointer}
.bnav button .ic{font-size:1.5rem;line-height:1}
.bnav button.on{color:var(--pri);font-weight:700}
.bnav button.sell{color:#fff;background:var(--sede,var(--acc));border-radius:16px;margin:6px 4px;min-height:56px;font-weight:800}
@media (min-width:1100px){
  .side{display:flex;flex-direction:column;width:230px;background:#fff;border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;gap:4px}
  .side .brand{font-weight:800;font-size:1.4rem;color:var(--pri);padding:6px 10px 14px}
  .side button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:12px;border-radius:10px;min-height:48px;cursor:pointer;font-size:1rem}
  .side button.on{background:var(--pribg);color:var(--pri);font-weight:700}
  .side button .ic{font-size:1.3rem;width:28px;text-align:center}
  .bnav{display:none}
  .main{padding:18px 24px 40px}
}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.kpi .l{color:var(--muted);font-size:.85rem}
.kpi .v{font-size:1.5rem;font-weight:800;margin-top:2px}
.kpi .s{color:var(--muted);font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:10px 18px;border-radius:12px;border:1.5px solid var(--pri);background:#fff;color:var(--pri);font-weight:700;cursor:pointer;text-decoration:none;user-select:none}
.btn.pri{background:var(--pri);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.sm{min-height:44px;padding:6px 12px;font-size:.92rem}
.btn.big{min-height:72px;font-size:1.35rem;padding:14px 28px;border-radius:18px}
.btn.huge{min-height:110px;font-size:2rem;width:100%;border-radius:22px;letter-spacing:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
label.f{display:block;font-size:.9rem;color:var(--muted);font-weight:600}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:4px}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=datetime-local],select,textarea{min-height:var(--tap);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:3px solid #9cc4c6;border-color:var(--pri)}
input[type=checkbox]{width:24px;height:24px;vertical-align:middle;accent-color:var(--pri)}
.chk{display:flex;align-items:center;gap:10px;min-height:48px;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;min-height:46px;cursor:pointer;font-weight:600}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.seg{display:flex;border:1.5px solid var(--pri);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;color:var(--pri);min-height:var(--tap);font-weight:700;cursor:pointer;padding:6px 10px}
.seg button.on{background:var(--pri);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:.95rem}
table.t th,table.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;background:#faf8f5;position:sticky;top:0}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.tot td{font-weight:800;border-top:2px solid var(--ink)}
table.t tr.click{cursor:pointer}
table.t tr.click:hover{background:#faf6ef}
.tw{overflow:auto;max-width:100%}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;background:var(--pribg);color:var(--pri)}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.bad{background:var(--badbg);color:var(--bad)} .pill.gray{background:#eee;color:#555}
.alert{border-radius:12px;padding:12px 14px;margin:10px 0;font-weight:600}
.alert.ok{background:var(--okbg);color:var(--ok)} .alert.warn{background:var(--warnbg);color:#7a5210} .alert.bad{background:var(--badbg);color:var(--bad)} .alert.info{background:var(--pribg);color:var(--pri)}
.muted{color:var(--muted)} .small{font-size:.86rem} .b{font-weight:700} .pos{color:var(--ok)} .neg{color:var(--bad)}
.right{text-align:right}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
/* vender */
.pos-wrap{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:700px){.pos-wrap{grid-template-columns:1fr 310px}.cart{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}}
@media (min-width:1000px){.pos-wrap{grid-template-columns:1fr 370px}}
.cartbar{position:fixed;left:10px;right:10px;bottom:78px;z-index:25;border:0;border-radius:16px;background:var(--pri);color:#fff;font-weight:800;font-size:1.1rem;min-height:58px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
@media (min-width:700px){.cartbar{display:none!important}}
.prods{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.pcard{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:120px;text-align:left}
.pcard:active{transform:scale(.98)}
.pcard .ph{height:70px;border-radius:10px;background:linear-gradient(135deg,#d9e7e6,#f3e2d2);display:flex;align-items:center;justify-content:center;font-size:1.6rem;overflow:hidden}
.pcard .ph img{width:100%;height:100%;object-fit:cover}
.pcard .nm{font-weight:700;font-size:.92rem;line-height:1.15}
.pcard .pr{font-weight:800;color:var(--acc);font-size:1.1rem}
.pcard .st{font-size:.8rem;color:var(--muted)}
.pcard.out{opacity:.45}
.colors{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.colors button{min-height:72px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:700;font-size:1.05rem;padding:8px}
.colors button small{display:block;font-weight:500;color:var(--muted);font-size:.82rem}
.colors button:disabled{opacity:.4}
.cline{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.cline .nm{flex:1;min-width:0}
.cline .nm div{font-weight:700;font-size:.95rem}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:1.3rem;font-weight:800;cursor:pointer}
.qty span{min-width:26px;text-align:center;font-weight:800}
.total{font-size:1.9rem;font-weight:900}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,30,35,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.ov{align-items:center}}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:18px 18px 24px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
@media (min-width:700px){.modal{border-radius:20px}}
.modal.wide{max-width:1100px}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mhead h2{flex:1;margin:0}
.x{width:48px;height:48px;border-radius:12px;border:0;background:#f0ece6;font-size:1.4rem;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#1f2a30;color:#fff;border-radius:14px;padding:12px 16px;z-index:60;display:flex;gap:14px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:92vw}
.toast button{background:#fff;color:#1f2a30;border:0;border-radius:10px;padding:10px 14px;font-weight:800;min-height:44px;cursor:pointer}
@media (min-width:1100px){.toast{bottom:24px}}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lowlist{max-height:240px;overflow:auto}
.hide{display:none!important}
/* impresión */
#print{display:none}
.rep-head{border-bottom:2px solid #000;margin-bottom:10px;padding-bottom:6px}
.rep-head .t1{font-size:18pt;font-weight:800}
.rep-head .t2{font-size:10pt}
.rep table{width:100%;border-collapse:collapse;font-size:9.5pt}
.rep th,.rep td{border:1px solid #999;padding:3px 5px;text-align:left}
.rep th{background:#eee}
.rep td.n,.rep th.n{text-align:right}
.rep tr.tot td{font-weight:800;background:#f3f3f3}
.rep tr.grp td{font-weight:800;background:#e8eeee}
.rep .firmas{display:flex;gap:60px;margin-top:60px}
.rep .firmas div{flex:1;border-top:1px solid #000;text-align:center;padding-top:4px}
@media print{
  @page{size:letter;margin:12mm}
  body{background:#fff;font-size:10pt}
  .app,.bnav,.ov,.toast{display:none!important}
  #print{display:block}
  .rep tr{page-break-inside:avoid}
  .rep thead{display:table-header-group}
}
</style>

<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>
<nav class="bnav" id="bnav"></nav>
<div id="print"></div>
<script>
'use strict';
/* =========================================================================
   ALIKA · Inventario y Ventas — app de un solo archivo (sin dependencias)
   Datos en IndexedDB del navegador. Respaldo portátil en .json
   ========================================================================= */
const APP_VERSION = '1.2.1';
const VERSION_ESQUEMA = 3;   // v2: varias sedes · v3: recetas de juegos y venta por partes (IndexedDB sigue en versión 2)
const DB_NAME = 'alika_inventario';
const STORES = ['config','productos','variantes','movimientos','eventos','gastos','cortes','precios_ref'];
const LIST_STORES = STORES.filter(s => s !== 'config');
const SEDE_STORES = ['movimientos','eventos','gastos','cortes'];   // registros que pertenecen a una sede
const TODAS = 'TODAS';
const SEDES_DEFAULT = [{codigo:'QRO', nombre:'Querétaro', color:'#1f4e52'}, {codigo:'MID', nombre:'Mérida', color:'#8a3a62'}];

const CATEGORIAS = ['Aretes','Dijes','Anillos','Pulseras','Juegos','Collares','Otros'];
const CAT_GASTO = ['Lugar / cuota','Transporte','Empaque y bolsas','Exhibidores y mobiliario','Personal','Comisiones de tarjeta','Publicidad','Comida','Otros'];
const TIPOS_EVENTO = ['Feria','Mercadito','Venta digital','Otro'];
const ESTADOS_EVENTO = ['Planeado','Activo','Cerrado'];
const METODOS = ['Efectivo','Tarjeta','Transferencia'];
const UBICACIONES = ['Stand','Casa'];
const TIPO_MOV_TXT = {ENTRADA:'Entrada',VENTA:'Venta',DEVOLUCION:'Devolución a Alika',AJUSTE:'Ajuste',CAMBIO:'Cambio',CONSUMO_PROPIO:'Consumo propio',TRASPASO:'Traspaso Stand/Casa',TRASPASO_SEDE:'Traspaso entre sedes',SEPARACION:'Separación de juego'};
const CAT_ICON = {Aretes:'💎',Dijes:'🔶',Anillos:'💍',Pulseras:'📿',Juegos:'🎁',Collares:'📿',Otros:'✨'};

/* ---------------- utilidades ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (typeof v === 'number') return isFinite(v) ? v : 0; const n = parseFloat(String(v ?? '').replace(/[$,\s]/g,'')); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const fmtMXN = new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2,maximumFractionDigits:2});
const money = n => fmtMXN.format(r2(num(n))).replace('MX$','$');
const moneyMXN = n => money(n) + ' MXN';
const fmtInt = new Intl.NumberFormat('es-MX');
const int = n => fmtInt.format(Math.round(num(n)*100)/100);
const pct = n => (isFinite(n) ? (n*100).toFixed(1) : '0.0') + '%';
function uuid(){
  if (crypto.randomUUID) try { return crypto.randomUUID(); } catch(e){}
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6]&15)|64; b[8] = (b[8]&63)|128;
  const h = [...b].map(x => x.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
const pad = n => String(n).padStart(2,'0');
const nowISO = () => new Date().toISOString();
function localDate(d = new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function localDT(d = new Date()){ return `${localDate(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fdate(s){ if(!s) return ''; const d = String(s).slice(0,10).split('-'); return d.length===3 ? `${d[2]}/${d[1]}/${d[0]}` : s; }
function fdt(iso){ if(!iso) return ''; const d = new Date(iso); if (isNaN(d)) return fdate(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function dayOf(iso){ const d = new Date(iso); return isNaN(d) ? String(iso).slice(0,10) : localDate(d); }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function hace(iso){
  if(!iso) return 'nunca';
  const ms = Date.now() - new Date(iso).getTime(); const h = ms/3600000;
  if (h < 1) return 'hace menos de una hora';
  if (h < 24) return `hace ${Math.floor(h)} h`;
  const d = Math.floor(h/24); return d === 1 ? 'hace 1 día' : `hace ${d} días`;
}
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
/* arregla caracteres dañados (�) que vienen en la hoja de Alika */
const FIX_CHARS = [[/CAF�/g,'CAFÉ'],[/CORAZ�N/g,'CORAZÓN'],[/DESCRIPCI�N/g,'DESCRIPCIÓN'],[/MAM�/g,'MAMÁ'],[/DICROI�/g,'DICROI'],[/�/g,'É']];
function cleanTxt(s){ let t = String(s ?? '').replace(/\s+/g,' ').trim().toUpperCase(); for (const [re,rep] of FIX_CHARS) t = t.replace(re,rep); return t; }
function debounce(fn, ms = 200){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function sum(arr, f = x => x){ let s = 0; for (const x of arr) s += num(f(x)); return s; }
function groupBy(arr, f){ const m = new Map(); for (const x of arr){ const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; }

/* ---------------- IndexedDB ---------------- */
let _db = null;
function openDB(){
  return new Promise((res, rej) => {
    const rq = indexedDB.open(DB_NAME, 2);
    rq.onupgradeneeded = () => { const db = rq.result; for (const s of [...STORES, 'meta']) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, {keyPath:'id'}); };
    rq.onsuccess = () => { _db = rq.result; res(_db); };
    rq.onerror = () => rej(rq.error);
  });
}
function tx(stores, mode, fn){
  return new Promise((res, rej) => {
    const t = _db.transaction(stores, mode); let out;
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Transacción cancelada'));
    out = fn(t);
  });
}
function getAll(store){ return new Promise((res, rej) => { const rq = _db.transaction(store).objectStore(store).getAll(); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); }

/* ---------------- Estado en memoria ---------------- */
const DEFAULT_CONFIG = {
  id:'config', sedes:SEDES_DEFAULT.map(x => ({...x})), sede_activa:'QRO', eventos_activos:{}, responsable:'', factor_precio_sugerido:2.0, moneda:'MXN',
  comision_tarjeta_pct:0, umbral_existencia_baja:1, ultimo_respaldo:null,
  personas:['Familia'], lista_casa:[], instalado:nowISO(), historial_importado:false,
  precios_partes:null   // null = usar PRECIOS_PARTES_DEFAULT
};
/* ---- sedes ---- */
const vista = () => S.config.sede_activa || 'QRO';
const esTodas = () => vista() === TODAS;
const sedes = () => (S.config.sedes && S.config.sedes.length) ? S.config.sedes : SEDES_DEFAULT;
const sedesCodigos = () => { const set = new Set(sedes().map(x => x.codigo)); for (const k of SEDE_STORES) for (const r of S[k]) if (r.sede_codigo && r.sede_codigo !== TODAS) set.add(r.sede_codigo); return [...set]; };
function sedeInfo(c){ if (c === TODAS) return {codigo:TODAS, nombre:'Todas las sedes', color:'#4a4f55'}; return sedes().find(x => x.codigo === c) || {codigo:c, nombre:c, color:'#666'}; }
const sedeNombre = c => sedeInfo(c).nombre;
const enSede = (r, sede = vista()) => sede === TODAS || r.sede_codigo === sede;
function precioVenta(p, sede = vista()){ const o = p && p.precios_sede && num(p.precios_sede[sede]); return o > 0 ? o : num(p && p.precio_venta); }
const S = { config:{...DEFAULT_CONFIG} };
for (const s of LIST_STORES) S[s] = [];
const IDX = { prod:new Map(), vari:new Map(), ev:new Map(), varsByProd:new Map() };
let _stock = null;

function reindex(){
  IDX.prod = new Map(S.productos.map(p => [p.id, p]));
  IDX.vari = new Map(S.variantes.map(v => [v.id, v]));
  IDX.ev = new Map(S.eventos.map(e => [e.id, e]));
  IDX.varsByProd = groupBy(S.variantes, v => v.producto_id);

}
async function loadAll(){
  for (const s of LIST_STORES) S[s] = await getAll(s);
  const cfg = (await getAll('config')).find(c => c.id === 'config');
  S.config = {...DEFAULT_CONFIG, ...(cfg || {})};
  if (!cfg){ S.config.esquema = VERSION_ESQUEMA; await saveConfig(); }
  S.movimientos.sort(cmpMov);
  reindex();
}
async function saveConfig(patch){ if (patch) Object.assign(S.config, patch); await tx(['config'],'readwrite', t => t.objectStore('config').put(S.config)); }
/* sello de cada registro. Lo que pertenece a una sede (movimientos, eventos, gastos, cortes) se registra en la sede activa;
   con "Todas" seleccionada no se puede registrar nada nuevo (se lanza error antes de escribir). */
/* orden de movimientos: fecha y, dentro de la misma operación, el orden en que se registraron (seq) */
const cmpMov = (a, b) => a.fecha_hora < b.fecha_hora ? -1 : a.fecha_hora > b.fecha_hora ? 1 : (num(a.seq) - num(b.seq)) || (a.id < b.id ? -1 : 1);
function stamp(r, store, i = 0){
  const n = nowISO(); if (!r.id) r.id = uuid(); if (!r.creado) r.creado = n; r.actualizado = n;
  if (store === 'movimientos' && r.seq === undefined) r.seq = i;
  if (SEDE_STORES.includes(store) && !r.sede_codigo){ if (esTodas()) throw new Error('Elige una sede para registrar.'); r.sede_codigo = vista(); }
  return r;
}
/* guarda varios registros (y los agrega/actualiza en memoria) en una sola transacción */
async function put(store, recs){
  recs = Array.isArray(recs) ? recs : [recs]; recs.forEach((r, i) => stamp(r, store, i));
  await tx([store],'readwrite', t => { const os = t.objectStore(store); for (const r of recs) os.put(r); });
  const arr = S[store]; const pos = new Map(arr.map((x,i) => [x.id,i]));
  for (const r of recs){ if (pos.has(r.id)) arr[pos.get(r.id)] = r; else arr.push(r); }
  if (store === 'movimientos') arr.sort(cmpMov);
  reindex(); return recs;
}
async function putMany(map){ // {store:[recs]} todo en una transacción
  const stores = Object.keys(map).filter(k => map[k].length);
  if (!stores.length) return;
  for (const k of stores) map[k].forEach((r, i) => stamp(r, k, i));
  await tx(stores,'readwrite', t => { for (const k of stores){ const os = t.objectStore(k); for (const r of map[k]) os.put(r); } });
  for (const k of stores){ const arr = S[k]; const pos = new Map(arr.map((x,i) => [x.id,i])); for (const r of map[k]){ if (pos.has(r.id)) arr[pos.get(r.id)] = r; else arr.push(r); } }
  S.movimientos.sort(cmpMov);
  reindex();
}
async function del(store, ids){
  ids = Array.isArray(ids) ? ids : [ids]; const set = new Set(ids);
  await tx([store],'readwrite', t => { const os = t.objectStore(store); for (const id of ids) os.delete(id); });
  S[store] = S[store].filter(x => !set.has(x.id)); reindex();
}
async function clearAll(){
  await tx(STORES,'readwrite', t => { for (const s of STORES) t.objectStore(s).clear(); });
  for (const s of LIST_STORES) S[s] = [];
  S.config = {...DEFAULT_CONFIG, sedes:sedes().map(x => ({...x})), instalado:nowISO(), esquema:VERSION_ESQUEMA}; await saveConfig(); reindex();
}

/* ---------------- Reglas de negocio ---------------- */
/* efecto del movimiento en la existencia */
function delta(m){
  switch (m.tipo){
    case 'ENTRADA': return num(m.cantidad);
    case 'VENTA': case 'DEVOLUCION': case 'CONSUMO_PROPIO': return -num(m.cantidad);
    case 'AJUSTE': case 'CAMBIO': case 'TRASPASO_SEDE': case 'SEPARACION': return num(m.cantidad); // con signo
    default: return 0; // TRASPASO no cambia el total
  }
}
/* piezas que cuentan como vendidas (para dinero) */
function vendidas(m){
  if (m.tipo === 'VENTA' || m.tipo === 'CONSUMO_PROPIO') return num(m.cantidad);
  if (m.tipo === 'CAMBIO') return -num(m.cantidad); // sale (-1) = vendida, regresa (+1) = venta revertida
  return 0;
}
const esVentaMov = m => m.tipo === 'VENTA' || m.tipo === 'CONSUMO_PROPIO' || m.tipo === 'CAMBIO';
function ventaLinea(m){ return vendidas(m) * num(m.precio_venta_unit) - num(m.descuento); }
function fabLinea(m){ return vendidas(m) * num(m.precio_fabricante_unit); }

/* existencia por sede: llave "SEDE|variante" */
function stockMap(){
  if (_stock) return _stock;
  const st = new Map();
  const g = (sede, id) => { const k = sede + '|' + id; if (!st.has(k)) st.set(k, {total:0, Stand:0, Casa:0}); return st.get(k); };
  for (const m of S.movimientos){
    const s = g(m.sede_codigo, m.variante_id); const d = delta(m); const u = m.ubicacion || 'Stand';
    s.total += d; s[u] = (s[u] || 0) + d;
    if (m.tipo === 'TRASPASO'){ const q = num(m.cantidad); s[u] -= q; s[m.ubicacion_destino || 'Casa'] += q; }
  }
  _stock = st; return st;
}
function stockOf(vid, sede = vista()){
  const st = stockMap();
  if (sede !== TODAS){ const x = st.get(sede + '|' + vid); return x ? {...x} : {total:0, Stand:0, Casa:0}; }
  const r = {total:0, Stand:0, Casa:0};
  for (const c of sedesCodigos()){ const x = st.get(c + '|' + vid); if (x){ r.total += x.total; r.Stand += x.Stand; r.Casa += x.Casa; } }
  return r;
}
function stockProd(pid, sede = vista()){ return sum(IDX.varsByProd.get(pid) || [], v => stockOf(v.id, sede).total); }
const prodOfVar = vid => IDX.prod.get(IDX.vari.get(vid)?.producto_id);
function varLabel(vid){ const v = IDX.vari.get(vid); const p = v && IDX.prod.get(v.producto_id); return p ? `${p.nombre} · ${v.color}` : '(variante borrada)'; }

function inventarioTotales(sede = vista()){
  if (sede === TODAS){ const t = {piezas:0, valor:0, valorVenta:0}; for (const c of sedesCodigos()){ const x = inventarioTotales(c); t.piezas += x.piezas; t.valor += x.valor; t.valorVenta += x.valorVenta; } return t; }
  let piezas = 0, valor = 0, valorVenta = 0;
  for (const v of S.variantes){ const p = IDX.prod.get(v.producto_id); if (!p) continue; const q = stockOf(v.id, sede).total; piezas += q; valor += q * num(p.precio_fabricante); valorVenta += q * precioVenta(p, sede); }
  return {piezas, valor, valorVenta};
}
function bajasExistencia(){
  const u = num(S.config.umbral_existencia_baja);
  return S.variantes.filter(v => { const p = IDX.prod.get(v.producto_id); return p && p.activo !== false && v.activo !== false && stockOf(v.id).total <= u; });
}

/* Estado de resultados. f = {evento_id, desde, hasta, soloEvento:boolean} */
function resultados(f = {}){
  const sede = f.sede || (f.evento_id ? TODAS : vista());
  const inRange = d => (!f.desde || d >= f.desde) && (!f.hasta || d <= f.hasta);
  const movs = S.movimientos.filter(m => esVentaMov(m) && enSede(m, sede) && (!f.evento_id || m.evento_id === f.evento_id) && inRange(dayOf(m.fecha_hora)));
  const gastos = S.gastos.filter(g => enSede(g, sede) && (!f.evento_id || g.evento_id === f.evento_id) && inRange(g.fecha));
  const r = {movs, gastosList:gastos, ventaLista:0, descuentos:0, venta:0, fab:0, piezas:0, comisiones:0,
    consumo:{venta:0, piezas:0, fab:0}, porMetodo:{}, gastosCat:{}, gastos:0, tickets:new Set()};
  for (const m of movs){
    const q = vendidas(m);
    r.ventaLista += q * num(m.precio_venta_unit); r.descuentos += num(m.descuento);
    r.venta += ventaLinea(m); r.fab += fabLinea(m); r.piezas += q; r.comisiones += num(m.comision);
    if (m.tipo === 'CONSUMO_PROPIO'){ r.consumo.venta += ventaLinea(m); r.consumo.piezas += q; r.consumo.fab += fabLinea(m); }
    const mp = m.tipo === 'CONSUMO_PROPIO' ? 'Consumo propio' : (m.metodo_pago || 'Efectivo');
    r.porMetodo[mp] = (r.porMetodo[mp] || 0) + ventaLinea(m);
    if (m.venta_grupo) r.tickets.add(m.venta_grupo);
  }
  for (const g of gastos){ r.gastosCat[g.categoria] = (r.gastosCat[g.categoria] || 0) + num(g.monto); r.gastos += num(g.monto); }
  if (r.comisiones){ r.gastosCat['Comisiones de tarjeta'] = (r.gastosCat['Comisiones de tarjeta'] || 0) + r.comisiones; r.gastos += r.comisiones; }
  r.margen = r.venta - r.fab;
  r.utilidad = r.margen - r.gastos;
  r.margenPct = r.venta ? r.margen / r.venta : 0;
  r.margenPieza = r.piezas ? r.margen / r.piezas : 0;
  r.peDinero = r.margenPct > 0 ? r.gastos / r.margenPct : null;
  r.pePiezas = r.margenPieza > 0 ? r.gastos / r.margenPieza : null;
  r.inversion = sum(gastos.filter(g => g.es_inversion_inicial), g => g.monto);
  return r;
}
function eventoDias(e){ if (!e.fecha_inicio) return 1; return Math.max(1, daysBetween(e.fecha_inicio, e.fecha_fin || e.fecha_inicio) + 1); }
function eventoActivo(sede = vista()){ if (sede === TODAS) return null; const e = IDX.ev.get((S.config.eventos_activos || {})[sede]); return e && e.estado !== 'Cerrado' && e.sede_codigo === sede ? e : null; }

/* ---------------- Cortes con Alika ---------------- */
/* ventas y devoluciones que todavía no están en un corte, por periodo y sede (o TODAS = corte en conjunto) */
function pendientesCorte(alcance, desde, hasta){
  const inR = m => (!desde || dayOf(m.fecha_hora) >= desde) && (!hasta || dayOf(m.fecha_hora) <= hasta);
  const base = S.movimientos.filter(m => !m.corte_id && enSede(m, alcance) && inR(m));
  return {ventas: base.filter(esVentaMov), devoluciones: base.filter(m => m.tipo === 'DEVOLUCION')};
}
async function generarCorte({alcance, desde, hasta, nota = '', folio = null}){
  const {ventas, devoluciones} = pendientesCorte(alcance, desde, hasta);
  if (!ventas.length && !devoluciones.length) throw new Error('No hay ventas ni devoluciones pendientes en ese periodo.');
  const id = uuid();
  const corte = {id, sede_codigo:alcance, fecha_corte:nowISO(), periodo_desde:desde || '', periodo_hasta:hasta || '',
    movimiento_ids:ventas.map(m => m.id), devolucion_ids:devoluciones.map(m => m.id),
    piezas:sum(ventas, vendidas), venta_total:r2(sum(ventas, ventaLinea)), total_a_pagar_fabricante:r2(sum(ventas, fabLinea)),
    piezas_devueltas:sum(devoluciones, m => m.cantidad), valor_devuelto:r2(sum(devoluciones, m => num(m.cantidad) * num(m.precio_fabricante_unit))),
    estado:'Pendiente', fecha_pago:null, referencia:'', nota, folio: folio || 'C-' + String(S.cortes.length + 1).padStart(3, '0')};
  await putMany({cortes:[corte], movimientos:[...ventas, ...devoluciones].map(m => ({...m, corte_id:id}))});
  return corte;
}
async function pagarCorte(id, fecha_pago, referencia){
  const c = S.cortes.find(x => x.id === id); if (!c) throw new Error('No existe el corte.');

}
async function cancelarCorte(id){
  const c = S.cortes.find(x => x.id === id); if (!c) return;
  if (c.estado === 'Pagado') throw new Error('Un corte pagado no se puede cancelar.');

  await del('cortes', id);

const sinEsp = t => norm(t).replace(/\s+/g, '');

/* aplica las recetas precargadas a los juegos que nunca han tenido receta (receta === undefined). Es idempotente. */
async function aplicarRecetasPrecargadas(){
  const cambios = [];
  for (const p of S.productos){
    if (p.receta !== undefined || p.parcial_de || p.parte_de || !esJuego(p)) continue;
    const pr = presetPara(p); if (!pr) continue;
    cambios.push({...p, receta: pr.r.map(([tipo, descripcion, costo, suelto]) => ({tipo, descripcion, costo_fabricante: costo == null ? null : costo, ...(suelto ? {suelto} : {})}))});
  }
  if (cambios.length) await put('productos', cambios);
  return cambios.length;
}
const esJuego = p => !!p && (p.categoria === 'Juegos' || Array.isArray(p.receta));
/* receta con costos efectivos: la diferencia contra el precio del juego se asigna al componente principal (dije o collar) */
function recetaEfectiva(p){
  const r = p && p.receta;
  if (!Array.isArray(r) || r.length < 2 || r.some(c => !(num(c.costo_fabricante) > 0))) return null;
  const diff = r2(num(p.precio_fabricante) - sum(r, c => c.costo_fabricante));
  let pi = r.findIndex(c => c.tipo === 'Dije' || c.tipo === 'Collar'); if (pi < 0) pi = 0;
  const out = r.map((c, i) => ({...c, idx: c.idx ?? i, costo: r2(num(c.costo_fabricante) + (i === pi ? diff : 0)), principal: i === pi}));
  return out.some(c => c.costo <= 0) ? null : out;
}
function avisoReceta(p){
  if (!esJuego(p)) return null;
  const r = p.receta;
  if (!Array.isArray(r) || r.length < 2 || r.some(c => !(num(c.costo_fabricante) > 0))) return {tipo:'falta', txt:'Falta receta'};
  const s = r2(sum(r, c => c.costo_fabricante)), diff = r2(num(p.precio_fabricante) - s);
  if (!recetaEfectiva(p)) return {tipo:'falta', txt:'Falta receta (la diferencia deja una pieza en $0)'};
  if (Math.abs(diff) > 0.004){ const pr = recetaEfectiva(p).find(c => c.principal); return {tipo:'dif', txt:`La receta suma ${money(s)} y el juego cuesta ${money(p.precio_fabricante)}: la diferencia (${money(diff)}) se asigna a ${TXT_PARTE[pr.tipo] || 'la pieza principal'}.`}; }
  return {tipo:'ok', txt:'Receta completa'};
}
function coincidePatron(patron, txt){
  const T = norm(txt);
  return norm(patron).split(' ').filter(Boolean).every(tok => tok.split('|').filter(Boolean).some(a => new RegExp('(^|[^A-Z0-9])' + a.replace(/[.*+?^${}()[\]\\]/g, '\\$&')).test(T)));
}

/* precio por defecto y piso de una parte (c = componente con tipo, descripcion y costo efectivo) */
function precioParte(c){

function asegurarParte(root, c, color, out){

/* juego parcial (quedan 2 o más piezas): clave = clave del juego + -S + letras de lo que falta */
function asegurarParcial(root, resto, color, out){

/* arma todos los registros de una separación. partes = [{idx, precio, desc}] (lo que se vende). No guarda nada. */
function construirSeparacion({vid, partes, fh, grupo, sede, ev, metodo, consumo, persona, pctCom}){
  const v = IDX.vari.get(vid), p = IDX.prod.get(v.producto_id), root = raizJuego(p), rec = recetaEfectiva(p);
  if (!rec) throw new Error('Este juego no tiene receta completa.');
  const st = stockOf(vid, sede); if (st.total < 1) throw new Error(`No hay existencia de ${p.nombre} ${v.color}.`);
  const sid = uuid(), ubic = st.Stand >= 1 ? 'Stand' : 'Casa';
  const out = {productos:[], variantes:[], movimientos:[], creadosProd:[], creadosVar:[], separacion_id:sid};
  const base = {fecha_hora:fh, sede_codigo:sede, ubicacion:ubic, separacion_id:sid, venta_grupo:grupo, evento_id: ev?.id || null, nota:`Separado de: ${p.nombre} ${v.color}`};
  out.movimientos.push({...base, id:uuid(), tipo:'SEPARACION', variante_id:vid, producto_id:p.id, cantidad:-1, precio_fabricante_unit:num(p.precio_fabricante), precio_venta_unit:precioVenta(p, sede)});
  const vendidosIdx = new Set(partes.map(x => x.idx));
  for (const pt of partes){
    const c = rec.find(x => x.idx === pt.idx); if (!c) throw new Error('Parte no encontrada en la receta.');
    const {prod, vari} = asegurarParte(root, c, v.color, out);
    out.movimientos.push({...base, id:uuid(), tipo:'SEPARACION', variante_id:vari.id, producto_id:prod.id, cantidad:1, precio_fabricante_unit:c.costo, precio_venta_unit:num(pt.precio)});
    out.movimientos.push({...base, id:uuid(), tipo: consumo ? 'CONSUMO_PROPIO' : 'VENTA', variante_id:vari.id, producto_id:prod.id, cantidad:1, parte:true,
      precio_fabricante_unit:c.costo, precio_venta_unit: consumo ? c.costo : num(pt.precio), descuento: consumo ? 0 : num(pt.desc),
      metodo_pago: consumo ? '' : metodo, comision: consumo ? 0 : r2((num(pt.precio) - num(pt.desc)) * (pctCom || 0)), persona: consumo ? persona : ''});
  }
  const resto = rec.filter(c => !vendidosIdx.has(c.idx));
  if (resto.length){
    const {prod, vari} = resto.length >= 2 ? asegurarParcial(root, resto, v.color, out) : asegurarParte(root, resto[0], v.color, out);
    out.movimientos.push({...base, id:uuid(), tipo:'SEPARACION', variante_id:vari.id, producto_id:prod.id, cantidad:1, precio_fabricante_unit:num(prod.precio_fabricante), precio_venta_unit:num(prod.precio_venta), sobrante:true});
  }
  return out;
}

/* ---------------- Lector de Excel (.xlsx) y CSV sin librerías ---------------- */
async function unzip(buf){
  const dv = new DataView(buf), td = new TextDecoder('utf-8');
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error('El archivo no es un Excel válido (.xlsx).');
  const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const files = {};
  for (let k = 0; k < count; k++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    files[td.decode(new Uint8Array(buf, p + 46, nlen))] = {method, csize, lho};
    p += 46 + nlen + elen + clen;
  }
  return {
    has: n => !!files[n],
    async text(name){
      const f = files[name]; if (!f) return null;
      const start = f.lho + 30 + dv.getUint16(f.lho + 26, true) + dv.getUint16(f.lho + 28, true);
      const data = new Uint8Array(buf, start, f.csize);
      if (f.method === 0) return td.decode(data);
      if (typeof DecompressionStream === 'undefined') throw new Error('Este navegador no puede abrir Excel. Usa Chrome reciente o guarda la hoja como CSV.');
      const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
      return td.decode(out);
    }
  };
}
function colIdx(ref){ const m = /^([A-Z]+)/.exec(ref); let n = 0; for (const ch of m[1]) n = n*26 + ch.charCodeAt(0) - 64; return n - 1; }
async function readXlsx(buf){
  const z = await unzip(buf); const P = new DOMParser();
  const xml = s => P.parseFromString(s, 'application/xml');
  const wb = xml(await z.text('xl/workbook.xml'));
  const rels = xml(await z.text('xl/_rels/workbook.xml.rels'));
  const relMap = {}; for (const r of rels.getElementsByTagName('Relationship')) relMap[r.getAttribute('Id')] = r.getAttribute('Target');
  const ss = [];
  const sst = await z.text('xl/sharedStrings.xml');
  if (sst){ for (const si of xml(sst).getElementsByTagName('si')){ let t = ''; for (const n of si.getElementsByTagName('t')){ if (n.parentNode.nodeName !== 'rPh') t += n.textContent; } ss.push(t); } }
  const sheets = [];
  for (const sh of wb.getElementsByTagName('sheet')){
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let target = relMap[rid] || ''; target = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//,'');
    const txt = await z.text(target); if (!txt) continue;
    const doc = xml(txt); const rows = []; const formulas = [];
    for (const row of doc.getElementsByTagName('row')){
      const ri = parseInt(row.getAttribute('r'), 10) - 1; const vals = []; const fs = [];
      for (const c of row.getElementsByTagName('c')){
        const ci = colIdx(c.getAttribute('r') || 'A'); const t = c.getAttribute('t');
        const v = c.getElementsByTagName('v')[0]; const f = c.getElementsByTagName('f')[0];
        let val = null;
        if (t === 's') val = v ? ss[parseInt(v.textContent, 10)] : null;
        else if (t === 'inlineStr'){ const is = c.getElementsByTagName('t')[0]; val = is ? is.textContent : null; }
        else if (t === 'str' || t === 'e') val = v ? v.textContent : null;
        else if (t === 'b') val = v ? v.textContent === '1' : null;
        else val = v ? parseFloat(v.textContent) : null;
        vals[ci] = val; if (f && f.textContent) fs[ci] = f.textContent;
      }
      rows[ri] = vals; formulas[ri] = fs;
    }
    for (let i = 0; i < rows.length; i++){ if (!rows[i]) rows[i] = []; if (!formulas[i]) formulas[i] = []; }
    sheets.push({name: sh.getAttribute('name'), rows, formulas});
  }
  return sheets;
}
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || ''; const sep = (first.split(';').length > first.split(',').length) ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep){ row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.map(r => r.map(v => { const t = v.trim(); return t !== '' && /^-?[\d,]*\.?\d+$/.test(t.replace(/^\$/,'')) ? num(t) : (t === '' ? null : t); }));
}
function toCSV(rows){
  return '﻿' + rows.map(r => r.map(v => { const s = v == null ? '' : String(v); return /[",;\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }).join(',')).join('\r\n');
}
function download(name, content, type = 'text/plain'){
  const blob = content instanceof Blob ? content : new Blob([content], {type});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

    if (RESUMEN_RE.test(norm(nombre))){ const ci = r.findIndex(v => typeof v === 'number'); if (ci >= 0){ resumen[norm(nombre)] = r[ci]; resumenF[norm(nombre)] = F[i]?.[ci] || ''; } continue; }
    let clave = cleanTxt(get(r,'clave')); let revisar = false;
    if (!clave){ clave = claveDesdeNombre(nombre); revisar = true; sinClave++; }
    const color = cleanTxt(get(r,'color')) || 'ÚNICO';
    const piezas = num(get(r,'piezas'));
    const costo = num(get(r,'costo'));
    const sugRaw = get(r,'sugerido'); const sugerido = num(sugRaw) > 0 ? num(sugRaw) : r2(costo * factor);
    const cf = map.costo != null ? F[i]?.[map.costo] : null;
    const desglose = cf && /^[\d+\s.]+$/.test(cf.replace(/^=/,'')) ? cf.replace(/^=/,'') : '';
    const categoria = map.categoria != null && get(r,'categoria') ? String(get(r,'categoria')).trim() : inferCategoria(nombre);
    const hist = []; const notasFila = [];
    for (const k of ['venta1','venta2','venta3']){
      const v = get(r,k); if (v == null || v === '') continue;
      if (typeof v === 'number'){ if (v > 0) hist.push({evento:k, precio:v}); }
      else notasFila.push(cleanTxt(v));
    }
    const ctoRaw = get(r,'cto'); let cto = null;
    if (typeof ctoRaw === 'number') cto = ctoRaw; else if (ctoRaw) notasFila.push(cleanTxt(ctoRaw));
    for (const h of hist){ h.fab = cto != null ? cto : costo; h.consumo = Math.abs(h.precio - h.fab) < 0.005; }
    variantes.push({fila:i+1, clave, nombre, color, piezas, costo, sugerido, categoria, desglose, revisar, hist, nota:[...new Set(notasFila)].join(' · ')});
  }
  const prodKey = v => `${v.clave}|${v.nombre}|${v.costo}`;
  const productos = groupBy(variantes, prodKey);
  const hist = variantes.flatMap(v => v.hist.map(h => ({...h, v})));
  const hv = k => hist.filter(h => h.evento === k);
  const tot = {
    variantes: variantes.length, piezas: sum(variantes, v => v.piezas), valor: sum(variantes, v => v.piezas * v.costo),
    claves: new Set(variantes.map(v => v.clave)).size, productos: productos.size, sinClave,
    categorias: [...groupBy(variantes, v => v.categoria)].map(([c, l]) => ({c, n:l.length, p:sum(l, v => v.piezas)})),
    histVenta: sum(hist, h => h.precio), histFab: sum(hist, h => h.fab), histPiezas: hist.length,
    histConsumo: sum(hist.filter(h => h.consumo), h => h.precio),
    eventos: ['venta1','venta2','venta3'].map(k => ({k, n:hv(k).length, venta:sum(hv(k), h => h.precio), fab:sum(hv(k), h => h.fab)})).filter(e => e.n),
    stand: Math.abs(num(resumen['COSTO STAND'])), uber: Math.abs(num(resumen['UBER'])), perdida: resumen['PERDIDA'],
    standPartes: partesFormula(resumenF['COSTO STAND']), uberPartes: partesFormula(resumenF['UBER']),
  };
  return {variantes, productos, tot, resumen};
}
function partesFormula(f){ if (!f || !/^[=+\-\d\s.]+$/.test(f)) return []; return (f.replace(/^=/,'').match(/\d+(\.\d+)?/g) || []).map(Number); }
function leerPrecios(sheet){
  const out = []; let cat = '';
  for (const r of sheet.rows){
    const a = r[0], b = r[1], c = r[2];
    if (a && typeof a === 'string' && !b && norm(a) !== 'IMAGEN') cat = cleanTxt(a);
    else if (b && typeof c === 'number') out.push({id:uuid(), categoria: cat ? cat.charAt(0) + cat.slice(1).toLowerCase() : '', descripcion: cleanTxt(b), costo: c});

function leerCasa(sheet){ return sheet.rows.flatMap(r => r.filter(v => typeof v === 'string' && v.trim().length > 6 && norm(v) !== 'TENEMOS').map(cleanTxt)); }

/* aplica la importación: crea productos, variantes, movimientos de ENTRADA, y opcionalmente historial */
/* casa cada producto del Excel con el catálogo: clave + nombre (prefiere el mismo costo); si no, la clave sola cuando es única */
function planImport(an){
  const base = S.productos.filter(p => !p.parcial_de && !p.parte_de);
  const porCN = groupBy(base, p => sinEsp(p.clave) + '|' + norm(p.nombre)), porC = groupBy(base, p => sinEsp(p.clave));
  const plan = [];
  for (const [key, vs] of an.productos){
    const v0 = vs[0];
    let cands = porCN.get(sinEsp(v0.clave) + '|' + norm(v0.nombre)) || [];
    if (!cands.length && !v0.revisar){ const c = porC.get(sinEsp(v0.clave)) || []; if (c.length === 1) cands = c; }
    const exacto = cands.find(p => Math.abs(num(p.precio_fabricante) - v0.costo) < 0.005);
    const p = exacto || cands[0] || null;
    const colores = new Set(p ? (IDX.varsByProd.get(p.id) || []).map(v => v.color) : []);
    plan.push({key, vs, v0, p, nuevo:!p, costoDif: p && !exacto ? {catalogo:num(p.precio_fabricante), excel:v0.costo} : null, coloresNuevos: p ? vs.filter(v => !colores.has(v.color)).length : vs.length});
  }
  return plan;
}
function totalesPlan(plan, costos = {}){
  let variantes = 0, piezas = 0, valor = 0, nuevos = 0, coloresNuevos = 0;
  for (const x of plan){ const c = x.nuevo || costos[x.key] === 'excel' ? x.v0.costo : num(x.p.precio_fabricante);
    for (const v of x.vs){ variantes++; piezas += v.piezas; valor += v.piezas * c; }
    if (x.nuevo) nuevos++; else coloresNuevos += x.coloresNuevos; }
  return {variantes, piezas, valor, nuevos, coloresNuevos};
}
async function aplicarImport(an, opt = {}){
  const sede = opt.sede || vista();
  if (!sede || sede === TODAS) throw new Error('Elige a qué sede se carga el inventario.');
  if (opt.nuevaSede && !sedes().some(x => x.codigo === sede)) await saveConfig({sedes:[...sedes().map(x => ({...x})), {...opt.nuevaSede}]});
  if (!sedes().some(x => x.codigo === sede)) throw new Error(`La sede ${sede} no existe.`);
  const modo = opt.modo || 'sumar';
  if (modo === 'inicial' && inventarioTotales(sede).piezas !== 0) throw new Error(`"Conteo inicial" solo se puede usar si ${sedeNombre(sede)} está en 0 piezas.`);
  const plan = opt.plan || planImport(an); const costos = opt.costos || {};
  const existentes = new Map(plan.filter(x => x.p).map(x => [x.key, x.p]));
  const varExist = new Map(S.variantes.map(v => [`${v.producto_id}|${v.color}`, v.id]));
  const productos = [], variantes = [], movs = [], eventos = [], gastos = [];
  const evIds = {};
  const fechaCarga = opt.fechaCarga || localDate();
  if (opt.historial && an.tot.eventos.length){
    for (const e of an.tot.eventos){
      const id = uuid(); evIds[e.k] = id;
      const fecha = opt.fechas?.[e.k] || fechaCarga;
      eventos.push({id, sede_codigo:sede, nombre: e.k.replace('venta','Venta '), tipo:'Mercadito', fecha_inicio:fecha, fecha_fin:fecha, costo_lugar: num(opt.stand?.[e.k]), estado:'Cerrado', nota:'Evento histórico importado de la hoja de Alika'});
      if (num(opt.stand?.[e.k])) gastos.push({id:uuid(), sede_codigo:sede, fecha, evento_id:id, categoria:'Lugar / cuota', monto:num(opt.stand[e.k]), descripcion:'Costo de stand (importado)', pagado_por:'', es_inversion_inicial:false, auto_lugar:true});
      if (num(opt.uber?.[e.k])) gastos.push({id:uuid(), sede_codigo:sede, fecha, evento_id:id, categoria:'Transporte', monto:num(opt.uber[e.k]), descripcion:'Uber (importado)', pagado_por:'', es_inversion_inicial:false});
    }
  }
  const fechas = Object.values(opt.fechas || {}).filter(Boolean).sort();
  const fechaEntrada = (opt.historial && fechas.length && fechas[0] < fechaCarga) ? fechas[0] : fechaCarga;
  let saltadas = 0; const actualizados = [];
  for (const [key, vs] of an.productos){
    const v0 = vs[0];
    let p = existentes.get(key);
    if (p && costos[key] === 'excel' && Math.abs(num(p.precio_fabricante) - v0.costo) >= 0.005){
      const f = num(S.config.factor_precio_sugerido) || 2, sugViejo = num(p.precio_sugerido);
      p = {...p, precio_fabricante:v0.costo, precio_sugerido:r2(v0.costo * f), precio_venta: Math.abs(num(p.precio_venta) - sugViejo) < 0.005 ? r2(v0.costo * f) : p.precio_venta};
      actualizados.push(p); existentes.set(key, p);
    }
    if (!p){
      p = {id:uuid(), clave:v0.clave, nombre:v0.nombre, categoria:v0.categoria, precio_fabricante:v0.costo,
        precio_sugerido:v0.sugerido, precio_venta:v0.sugerido, foto:'', activo:true, revisar:v0.revisar,
        desglose:v0.desglose, nota:[...new Set(vs.map(v => v.nota).filter(Boolean))].join(' · ')};
      productos.push(p); existentes.set(key, p);
    }
    for (const v of vs){
      let vid = varExist.get(`${p.id}|${v.color}`);
      if (!vid){ vid = uuid(); varExist.set(`${p.id}|${v.color}`, vid); variantes.push({id:vid, producto_id:p.id, color:v.color, activo:true, fila_origen:v.fila}); }
      const vendidasHist = opt.historial ? v.hist.length : 0;
      const qEntrada = v.piezas + vendidasHist;
      if (qEntrada > 0) movs.push({id:uuid(), sede_codigo:sede, fecha_hora:new Date(fechaEntrada + 'T09:00').toISOString(), tipo:'ENTRADA', variante_id:vid, producto_id:p.id, cantidad:qEntrada, ubicacion:'Stand',
        precio_venta_unit:p.precio_venta, precio_fabricante_unit:p.precio_fabricante, nota:(modo === 'inicial' ? 'Conteo inicial desde hoja de Alika' : 'Entrada desde hoja de Alika (se sumó a lo que había)') + (vendidasHist ? ` (incluye ${vendidasHist} vendida(s) en eventos pasados)` : '')});
      if (opt.historial) for (const h of v.hist){
        const fecha = opt.fechas?.[h.evento] || fechaCarga;
        movs.push({id:uuid(), sede_codigo:sede, fecha_hora:new Date(fecha + 'T12:00').toISOString(), tipo: h.consumo ? 'CONSUMO_PROPIO' : 'VENTA', variante_id:vid, producto_id:p.id, cantidad:1,
          ubicacion:'Stand', precio_venta_unit:h.precio, precio_fabricante_unit:h.fab, descuento:0, metodo_pago: h.consumo ? '' : 'Efectivo', comision:0,
          evento_id:evIds[h.evento], persona: h.consumo ? (opt.persona || 'Familia') : '', nota:'Historial importado', venta_grupo:'HIST-' + h.evento});
      }
    }
  }
  const precios = (opt.precios || []).filter(r => !S.precios_ref.some(x => norm(x.descripcion) === norm(r.descripcion) && num(x.costo) === num(r.costo)));
  await putMany({productos:[...productos, ...actualizados], variantes, movimientos:movs, eventos, gastos, precios_ref:precios});
  await aplicarRecetasPrecargadas();
  const patch = {};
  if (opt.casa?.length) patch.lista_casa = opt.casa;
  if (opt.historial && eventos.length) patch.historial_importado = true;
  if (opt.persona && !S.config.personas.includes(opt.persona)) patch.personas = [...S.config.personas, opt.persona];
  if (Object.keys(patch).length) await saveConfig(patch);
  return {sede, modo, productos:productos.length, actualizados:actualizados.length, variantes:variantes.length, movimientos:movs.length, eventos:eventos.length, gastos:gastos.length, saltadas, piezas:sum(movs.filter(m => m.tipo === 'ENTRADA'), m => m.cantidad)};
}

/* alcance = TODAS (todas las sedes) o el código de una sede (catálogo completo + solo los registros de esa sede) */
function snapshot(alcance = TODAS){
  const data = {};
  for (const s of LIST_STORES) data[s] = (SEDE_STORES.includes(s) && alcance !== TODAS) ? S[s].filter(r => r.sede_codigo === alcance) : S[s];
  return {app:'alika-inventario', version_esquema:VERSION_ESQUEMA, app_version:APP_VERSION, alcance,
    sedes: alcance === TODAS ? sedesCodigos() : [alcance], sede_nombre: sedeNombre(alcance), generado:nowISO(), config:S.config, data};
}
function nombreRespaldo(alcance = TODAS){ const d = new Date(); return `ALIKA_${alcance}_${localDate(d)}_${pad(d.getHours())}${pad(d.getMinutes())}.json`; }
async function guardarRespaldo(share = false, alcance = TODAS){
  const snap = snapshot(alcance); const name = nombreRespaldo(alcance);
  const text = JSON.stringify(snap);
  const file = new File([text], name, {type:'application/json'});
  let ok = false;
  if (share && navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:'Respaldo Alika', text:`Respaldo Alika (${sedeNombre(alcance)}) ${fdt(nowISO())}`}); ok = true; }
    catch(e){ if (e.name === 'AbortError') return false; }
  }
  if (!ok) download(name, file);
  if (alcance === TODAS) await saveConfig({ultimo_respaldo:nowISO()});
  return true;
}
function validarRespaldo(o){
  if (!o || typeof o !== 'object') throw new Error('El archivo no es un respaldo.');
  if (o.app !== 'alika-inventario') throw new Error('Este archivo no es un respaldo de la app Alika.');
  if (!o.data || typeof o.data !== 'object') throw new Error('El respaldo está dañado (sin datos).');
  if (num(o.version_esquema) > VERSION_ESQUEMA) throw new Error('El respaldo es de una versión más nueva de la app. Actualiza la app primero (botón "Actualizar").');
  for (const s of LIST_STORES){
    const arr = o.data[s] ?? [];
    if (!Array.isArray(arr)) throw new Error(`El respaldo está dañado (${s}).`);
    for (const r of arr) if (!r || typeof r.id !== 'string') throw new Error(`El respaldo está dañado: hay un registro sin ID en ${s}.`);
  }
  for (const m of o.data.movimientos || []) if (!m.tipo || !m.variante_id) throw new Error('El respaldo está dañado: hay movimientos incompletos.');
  if (num(o.version_esquema) >= 2) for (const s of SEDE_STORES) for (const r of o.data[s] || []) if (!r.sede_codigo) throw new Error(`El respaldo está dañado: hay registros sin sede en ${s}.`);
  return true;
}
const CAMPOS_V12 = ['receta','parcial_de','componentes_idx','parte_de','parte_idx','precios_sede'];
async function cargarRespaldo(o, modo){
  validarRespaldo(o);
  o = migrarSnapshot(o);   // respaldos de la v1 se pasan a QRO automáticamente
  if (modo === 'reemplazar'){
    const cfgLocal = {...S.config};
    await tx(STORES,'readwrite', t => {
      for (const s of LIST_STORES){ const os = t.objectStore(s); os.clear(); for (const r of o.data[s] || []) os.put(r); }
      const cfg = {...DEFAULT_CONFIG, ...(o.config || {}), id:'config', ultimo_respaldo:cfgLocal.ultimo_respaldo, esquema:VERSION_ESQUEMA};
      if (o.alcance && o.alcance !== TODAS) cfg.sede_activa = o.alcance;
      t.objectStore('config').put(cfg);
    });
    await loadAll();
    await aplicarRecetasPrecargadas();
    return {modo, total: sum(LIST_STORES, s => (o.data[s] || []).length), migrado: !!o.migrado_de};
  }
  // fusionar: une por UUID; si existe en ambos, gana el más reciente
  let nuevos = 0, actualizados = 0, iguales = 0, omitidos = 0;
  const elim = new Set([...(S.config.eliminados || []), ...((o.config || {}).eliminados || [])]);   // borrados en cualquiera de los dos equipos: no reviven
  const map = {};
  for (const s of LIST_STORES){
    const local = new Map(S[s].map(r => [r.id, r])); map[s] = [];
    for (const r of o.data[s] || []){
      if (elim.has(r.id)){ omitidos++; continue; }
      const l = local.get(r.id);
      if (!l){ map[s].push(r); nuevos++; }
      else if ((r.actualizado || '') > (l.actualizado || '')){
        const x = {...r}; for (const k of CAMPOS_V12) if (x[k] === undefined && l[k] !== undefined) x[k] = l[k];   // un respaldo de v1.1 no trae recetas: se conservan
        map[s].push(x); actualizados++; }
      else iguales++;
    }
  }
  const stores = LIST_STORES.filter(s => map[s].length);
  if (stores.length) await tx(stores,'readwrite', t => { for (const s of stores){ const os = t.objectStore(s); for (const r of map[s]) os.put(r); } });
  if (elim.size) await saveConfig({eliminados:[...elim]});
  if (o.config){ const patch = {}; if (o.config.personas) patch.personas = [...new Set([...S.config.personas, ...o.config.personas])];
    const ss = sedes().map(x => ({...x})); for (const x of o.config.sedes || []) if (!ss.some(y => y.codigo === x.codigo)) ss.push({...x}); patch.sedes = ss;
    await saveConfig(patch); }
  await loadAll();
  await aplicarRecetasPrecargadas();
  return {modo, nuevos, actualizados, iguales, omitidos, migrado: !!o.migrado_de};
}

/* ---------------- modales, avisos ---------------- */
let _modals = [];
function modal(html, {wide = false, onClose} = {}){
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}">${html}</div>`;
  ov.addEventListener('mousedown', e => { if (e.target === ov) ov._down = true; });
  ov.addEventListener('click', e => { if (e.target === ov && ov._down) closeModal(); ov._down = false; });
  document.body.appendChild(ov); ov._onClose = onClose; _modals.push(ov);
  const f = ov.querySelector('[autofocus]'); if (f) setTimeout(() => f.focus(), 50);
  return ov.firstElementChild;
}
function closeModal(){ const ov = _modals.pop(); if (ov){ ov.remove(); ov._onClose && ov._onClose(); } }
function closeAll(){ while (_modals.length) closeModal(); }
const mhead = t => `<div class="mhead"><h2>${t}</h2><button class="x" data-a="close" aria-label="Cerrar">✕</button></div>`;
A.close = () => closeModal();
document.addEventListener('keydown', e => { if (e.key === 'Escape' && _modals.length) closeModal(); });

function confirmDlg({titulo = '¿Seguro?', msg = '', ok = 'Sí, continuar', cancel = 'Cancelar', danger = false} = {}){
  return new Promise(res => {
    const m = modal(`${mhead(titulo)}<div class="stack"><div>${msg}</div>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-r="0">${cancel}</button><button class="btn ${danger ? 'bad' : 'pri'}" data-r="1">${ok}</button></div></div>`,
      {onClose:() => res(false)});
    m.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { const v = b.dataset.r === '1'; const ov = _modals.pop(); ov.remove(); res(v); });
  });
}
function alertDlg(titulo, msg){ return confirmDlg({titulo, msg, ok:'Entendido', cancel:'Cerrar'}); }
let _toastT = null;
function toast(msg, {accion, fn, ms = 3500} = {}){
  $$('.toast').forEach(t => t.remove()); clearTimeout(_toastT);
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span>${msg}</span>${accion ? `<button>${accion}</button>` : ''}`;
  if (accion) t.querySelector('button').onclick = () => { t.remove(); fn && fn(); };
  document.body.appendChild(t); _toastT = setTimeout(() => t.remove(), ms);
}
const val = (sel, root = document) => { const el = $(sel, root); return el ? el.value : ''; };

const opt = (v, t, sel) => `<option value="${esc(v)}" ${String(v) === String(sel) ? 'selected' : ''}>${esc(t)}</option>`;
function eventosOpts(sel, {todos = 'Todos los eventos', soloAbiertos = false, ninguno = null, sede = vista()} = {}){

}
function catsEnUso(){ const set = new Set(S.productos.map(p => p.categoria)); return CATEGORIAS.filter(c => set.has(c)).concat([...set].filter(c => !CATEGORIAS.includes(c))); }
function catChips(sel, action){ return `<div class="chips">${['Todas', ...catsEnUso()].map(c => `<button class="chip ${sel===c?'on':''}" data-a="${action}" data-v="${esc(c)}">${c === 'Todas' ? 'Todas' : (CAT_ICON[c]||'') + ' ' + esc(c)}</button>`).join('')}</div>`; }
function matchProd(p, q){ if (!q) return true; const Q = norm(q); return norm(p.nombre).includes(Q) || norm(p.clave).includes(Q); }

SCREENS.vender_after = () => { if ($('#pgrid')){ renderGrid(); renderCart(); } };
function renderGrid(){
  const enCarrito = vid => sum(UI.cart.filter(l => l.vid === vid), l => l.q);
  const prods = S.productos.filter(p => p.activo !== false && (UI.vcat === 'Todas' || p.categoria === UI.vcat) && matchProd(p, UI.vq))
    .sort((a,b) => a.nombre.localeCompare(b.nombre));

      <div class="st">${esc(p.clave)} · ${int(st)} pzs · ${vs.length} color${vs.length === 1 ? '' : 'es'}</div></button>`;

}

/* elegir qué partes se venden y a qué precio */
function modalPartes(vid, lineaIdx = null){
  const p = prodOfVar(vid), v = IDX.vari.get(vid), rec = recetaEfectiva(p);
  const previa = lineaIdx != null ? UI.cart[lineaIdx] : null;
  const sel = new Map((previa ? previa.partes : []).map(x => [x.idx, x.precio]));
  const m = modal(`${mhead('✂️ Vender por partes')}<div class="muted" style="margin:-6px 0 10px">${esc(p.nombre)} · ${esc(v.color)} · costo del juego ${money(p.precio_fabricante)}</div>
    <div id="mpl"></div><div id="mpt" style="margin-top:10px"></div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri big" id="mpok">Agregar a la venta</button></div>`, {wide:true});
  const draw = () => {
    $('#mpl', m).innerHTML = rec.map(c => { const pp = precioParte(c), on = sel.has(c.idx), pr = on ? num(sel.get(c.idx)) : pp.precio;
      return `<div class="card" style="padding:12px;margin-bottom:8px;${on ? 'border:2px solid var(--pri)' : ''}"><div class="row">
        <label class="chk" style="flex:1;min-width:200px"><input type="checkbox" data-pc="${c.idx}" ${on ? 'checked' : ''}><span><b>${esc(c.descripcion)}</b><div class="small muted">${esc(c.tipo)} · costo ${money(c.costo)}${c.principal && Math.abs(c.costo - num(c.costo_fabricante)) > 0.004 ? ` (receta ${money(c.costo_fabricante)} + ajuste)` : ''} · sugerido ${money(pp.precio)} · piso ${money(pp.piso)}</div></span></label>
        <label class="f" style="width:140px">Precio<input type="number" inputmode="decimal" data-pp="${c.idx}" value="${pr}" ${on ? '' : 'disabled'}></label></div>
        <div class="small" data-pi="${c.idx}"></div></div>`; }).join('');
    $$('[data-pc]', m).forEach(ch => ch.onchange = () => { const i = +ch.dataset.pc; if (ch.checked) sel.set(i, precioParte(rec.find(c => c.idx === i)).precio); else sel.delete(i); draw(); });
    $$('[data-pp]', m).forEach(inp => inp.oninput = () => { sel.set(+inp.dataset.pp, num(inp.value)); info(); });
    info();
  };
  const info = () => {
    let fab = 0, venta = 0;
    for (const c of rec){ const el = $(`[data-pi="${c.idx}"]`, m); if (!sel.has(c.idx)){ el.innerHTML = ''; continue; }
      const pr = num(sel.get(c.idx)), pp = precioParte(c); fab += c.costo; venta += pr;

function agregarCarrito(vid){
  const v = IDX.vari.get(vid), p = IDX.prod.get(v.producto_id);
  const enCarrito = sum(UI.cart.filter(l => l.vid === vid), l => l.q);
  if (enCarrito + 1 > stockOf(vid).total){ toast(`No hay suficientes piezas: quedan ${int(stockOf(vid).total)}`); return; }
  const l = UI.cart.find(x => x.vid === vid && !x.partes);
  if (l) l.q++; else UI.cart.push({vid, q:1, precio:precioVenta(p)});
  UI.ultimaVenta = null; renderCart(); renderGrid();
}
function cartCalc(){
  const lines = UI.cart.map(l => { const v = IDX.vari.get(l.vid); const p = IDX.prod.get(v?.producto_id);
    if (l.partes){ const fab = sum(l.partes, x => x.costo); return {...l, v, p, fab, sub: UI.consumo ? fab : sum(l.partes, x => x.precio)}; }
    return {...l, v, p, fab:num(p?.precio_fabricante), sub: l.q * (UI.consumo ? num(p?.precio_fabricante) : num(l.precio))}; }).filter(l => l.p);
  const subtotal = sum(lines, l => l.sub);
  let desc = UI.consumo ? 0 : (UI.desc.t === '%' ? subtotal * num(UI.desc.v) / 100 : num(UI.desc.v));
  desc = r2(Math.min(Math.max(desc, 0), subtotal));
  let restante = desc;
  lines.forEach((l, i) => { l.desc = i === lines.length - 1 ? r2(restante) : r2(subtotal ? desc * l.sub / subtotal : 0); restante -= l.desc; l.final = l.q ? (l.sub - l.desc) / l.q : 0; l.perdida = !UI.consumo && l.final < l.fab - 0.004;
    if (l.partes){ let rp = l.desc; l.partesCalc = l.partes.map((x, j) => { const pr = UI.consumo ? x.costo : x.precio; const d = j === l.partes.length - 1 ? r2(rp) : r2(l.sub ? l.desc * pr / l.sub : 0); rp -= d; return {...x, precio:pr, desc:d, perdida: !UI.consumo && pr - d < x.costo - 0.004, bajoPiso: !UI.consumo && pr < x.piso - 0.004}; });
      l.perdida = l.partesCalc.some(x => x.perdida); } });
  const total = r2(subtotal - desc); const fab = sum(lines, l => l.q * l.fab);
  const comision = UI.metodo === 'Tarjeta' && !UI.consumo ? r2(total * num(S.config.comision_tarjeta_pct) / 100) : 0;
  return {lines, subtotal, desc, total, fab, margen: total - fab - comision, comision, piezas: sum(lines, l => l.q)};
}

  }

  if (perd.length && !await confirmDlg({titulo:'🔴 Venta con pérdida', msg:`<div class="alert bad">Estás perdiendo ${money(sum(perd, l => (l.fab - l.final) * l.q))} en esta venta. A Fabiola se le paga igual el precio de fabricante.</div>¿Registrar de todos modos?`, ok:'Sí, registrar', danger:true})) return;
  const grupo = uuid(); const fh = nowISO(); const pctCom = UI.metodo === 'Tarjeta' ? num(S.config.comision_tarjeta_pct) / 100 : 0;
  const sep = {productos:[], variantes:[], movimientos:[], creadosProd:[], creadosVar:[]};
  try {
    for (const l of c.lines.filter(x => x.partes)){
      const o = construirSeparacion({vid:l.vid, partes:l.partesCalc, fh, grupo, sede:vista(), ev, metodo:UI.metodo, consumo:UI.consumo, persona:UI.persona, pctCom});
      for (const k of ['productos','variantes','movimientos','creadosProd','creadosVar']) sep[k].push(...o[k]);
    }
  } catch (e){ await alertDlg('No se pudo separar', esc(e.message)); return; }
  const movs = c.lines.filter(l => !l.partes).map(l => {
    const st = stockOf(l.vid);

      metodo_pago: UI.consumo ? '' : UI.metodo, comision: UI.consumo ? 0 : r2((l.sub - l.desc) * pctCom),
      evento_id: ev?.id || null, persona: UI.consumo ? UI.persona : '', nota:'', venta_grupo:grupo};
  });
  await putMany({productos:sep.productos, variantes:sep.variantes, movimientos:[...movs, ...sep.movimientos]});   // todo en una sola operación
  const todosIds = [...movs, ...sep.movimientos].map(m => m.id);
  UI.ultimaVenta = {total:c.total, piezas:c.piezas, metodo: UI.consumo ? 'Consumo propio · ' + UI.persona : UI.metodo};

  renderCart(); renderGrid();

  }});
};

/* selector de pieza (producto → color) reutilizable */
function pickVariante({titulo = 'Elige la pieza', soloConExistencia = false} = {}){
  return new Promise(res => {
    let q = '', done = false;
    const m = modal(`${mhead(titulo)}<input type="search" id="pkq" placeholder="🔍 Buscar por nombre, clave o color…" autofocus><div id="pkl" style="margin-top:10px"></div>`, {wide:true, onClose:() => { if (!done) res(null); }});
    const draw = () => {
      const Q = norm(q);
      const vs = S.variantes.filter(v => { const p = IDX.prod.get(v.producto_id); if (!p) return false; if (soloConExistencia && stockOf(v.id).total <= 0) return false;
        return !Q || norm(p.nombre + ' ' + p.clave + ' ' + v.color).includes(Q) || Q.split(' ').every(w => norm(p.nombre + ' ' + p.clave + ' ' + v.color).includes(w)); });
      $('#pkl', m).innerHTML = `<div class="tw" style="max-height:60vh"><table class="t">${vs.slice(0, 150).map(v => { const p = IDX.prod.get(v.producto_id);
        return `<tr class="click" data-pick="${v.id}"><td><b>${esc(p.nombre)}</b><div class="small muted">${esc(p.clave)}</div></td><td>${esc(v.color)}</td><td class="n">${money(precioVenta(p))}</td><td class="n">${int(stockOf(v.id).total)} pzs</td></tr>`; }).join('')}</table></div>
        ${vs.length > 150 ? `<div class="small muted">Mostrando 150 de ${vs.length}. Escribe para filtrar.</div>` : ''}${!vs.length ? '<div class="empty">Sin resultados</div>' : ''}`;
      $$('[data-pick]', m).forEach(tr => tr.onclick = () => { done = true; closeModal(); res(tr.dataset.pick); });
    };
    $('#pkq', m).oninput = debounce(e => { q = e.target.value; draw(); }, 120); draw();
  });
}

      ${pr && pn ? `<div class="alert ${dif > 0 ? 'info' : dif < 0 ? 'warn' : 'ok'}">${dif > 0 ? `Cobrar al cliente: <b>${money(dif)}</b>` : dif < 0 ? `Devolver al cliente: <b>${money(-dif)}</b>` : 'Cambio parejo: no hay diferencia de precio.'}</div>
        ${dif ? `<div class="seg">${METODOS.map(x => `<button class="${st.metodo===x?'on':''}" data-m="${x}">${x}</button>`).join('')}</div>` : ''}

    $('#cbn', m).onclick = async () => { const v = await pickVariante({titulo:'¿Qué pieza se lleva?', soloConExistencia:true}); if (v){ st.nueva = v; st.precioNueva = precioVenta(prodOfVar(v)); } draw(); };
    if ($('#cpr', m)) $('#cpr', m).onchange = e => { st.precioRet = num(e.target.value); draw(); };
    if ($('#cpn', m)) $('#cpn', m).onchange = e => { st.precioNueva = num(e.target.value); draw(); };
    $$('[data-m]', m).forEach(b => b.onclick = () => { st.metodo = b.dataset.m; draw(); });
    if ($('#cok', m)) $('#cok', m).onclick = async () => {
      if (st.ret === st.nueva){ toast('Es la misma pieza.'); return; }

      const g = uuid(), fh = nowISO(), pret = prodOfVar(st.ret), pnew = prodOfVar(st.nueva);
      const com = st.metodo === 'Tarjeta' && dif > 0 ? r2(dif * num(S.config.comision_tarjeta_pct) / 100) : 0;
      await put('movimientos', [
        {id:uuid(), fecha_hora:fh, tipo:'CAMBIO', variante_id:st.ret, producto_id:pret.id, cantidad:1, ubicacion:'Stand', precio_venta_unit:num(st.precioRet), precio_fabricante_unit:num(pret.precio_fabricante), descuento:0, metodo_pago:dif ? st.metodo : '', comision:0, evento_id:ev.id, nota:'Regresa en cambio', venta_grupo:g},
        {id:uuid(), fecha_hora:fh, tipo:'CAMBIO', variante_id:st.nueva, producto_id:pnew.id, cantidad:-1, ubicacion:'Stand', precio_venta_unit:num(st.precioNueva), precio_fabricante_unit:num(pnew.precio_fabricante), descuento:0, metodo_pago:dif ? st.metodo : '', comision:com, evento_id:ev.id, nota:'Sale en cambio', venta_grupo:g},
      ]);
      closeModal(); toast('✅ Cambio registrado'); if (UI.screen === 'vender'){ renderGrid(); }
    };
  };
  draw();
};
